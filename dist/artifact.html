 WITH TOOLS]` or `[ANY CHAT]` with data · BEFORE", "notes": [], "after": [], "short": null, "full": "There's a process we run out of habit. Propose a better way and prove it against our historical data, not with arguments.\n\nTHE PROCESS: [e.g. “the quarterly review deck”]\nWHAT IT EXISTS FOR: [e.g. “catch problems early and move money and people around”]\nHISTORICAL DATA: [what we have / where it lives]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Design a better way to achieve that goal.\n2. Backtest it: run the new way over past periods and show specific cases where it would have caught a problem earlier than the old way, and where it would have lost. Without data: “NOT RUN” and a plan for the test.\n3. A plan for a parallel run: the old and new ways run side by side for one cycle. What we compare and the criterion for deciding which wins. We fix the criterion now, before the run.\n4. What could make the new way worse than the old one (what the old ritual quietly provided)."}]}, {"n": 18, "title": "Going deeper", "when": "**When to use:** BEFORE (18.1, 18.2) or DURING, once you're inside the data (18.3, 18.4). You don't need the result faster or bigger; you need it done genuinely well, at a level where a professional in the field would learn something new.", "keep": "**Keep in mind:**\n- “Act like a professional” changes the model's vocabulary, not its methods. Demand the tools the best people use: databases and statistical models instead of a table in the chat, measurements instead of estimates. The model usually knows which tools it needs, so ask.\n- Start from the rawest material, not a summary someone already digested.\n- An unreasonably high target (not 5 seconds instead of 10, but 200 ms) pushes further than “do your best”. But a high target tempts the model to declare success. So use it only together with an external judge and the HONESTY line.\n- A deep result is easy to accept without understanding it. Before you rely on it, take the key part apart ([7.3](#7-writing-code-and-debugging), quiz [0.9](#0-one-liners)).\n- The external judge: don't ask the model to grade itself (for now; this may change as models improve). The best judge is a tool the model runs itself and gets an answer from immediately: a test, a benchmark, a data query, a check on unseen data.", "intro": [], "prompts": [{"id": "18.1", "title": "Deeper, not more", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Don't do the task. Rewrite my framing so that it demands deeper work, not more volume.\n\nMY FRAMING: [TASK or “see above”]\n\n1. What the best professional in this field would do here that I'm not asking for.\n2. The rawest material they would start from (instead of the already processed material I have).\n3. What specific methods and tools they would use. Not job titles, methods.\n4. Who or what, other than you and me, would show that the result is correct: a tool, a test, data, an outside expert.\n5. A new framing as one copyable block that demands exactly that. Below it: what I'm missing to carry it out (access, data, time)."}, {"id": "18.2", "title": "An unreasonable target with an external judge", "meta": "`[AGENT WITH TOOLS]` · BEFORE → AFTER", "notes": ["Define the judge with [9.2](#9-verification) first."], "after": [], "short": null, "full": "The target below seems unreasonable. It is achievable: keep looking for a way until you hit the limit. But success is decided by an external judge, not by you.\n\nTASK: [TASK]\nSTRETCH TARGET (well above “normal”): [e.g. “200 ms instead of 10 s”]\nACCEPTANCE BAR (what's actually good enough, e.g. “5 s”): [ACCEPTANCE BAR]\nTHE JUDGE (WHAT WE MEASURE WITH): [benchmark / test / metric / “propose one”]\nLIMIT: [time / number of attempts]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Before the work: lock in the judge and a baseline measurement: what we measure, how, and what result counts as success. If there's no judge, build one first and show it to me. Don't change the judge afterwards.\n2. Not allowed: changing the measurement, weakening the test, fitting the data, narrowing the task without my agreement. If you want to do any of that, stop and ask.\n3. Work in iterations: hypothesis → change → measurement by the judge → conclusion. Keep a table of attempts.\n4. At the end: the baseline and final measurements (the judge's raw output), what produced gains, what didn't work, where you hit a ceiling and why. If the stretch target wasn't reached, use the format “not reached: best X, barrier Y”; that's a normal result. I decide acceptance against the bar, not the stretch target."}, {"id": "18.3", "title": "Challenge what we believe is true", "meta": "`[AGENT WITH TOOLS]` or `[ANY CHAT]` with raw data · DURING", "notes": [], "after": [], "short": null, "full": "We have a belief that decisions are built on. Test it adversarially against the raw data: your job is to find where it's wrong, not to confirm it.\n\nTHE BELIEF (e.g. “churn is an onboarding problem”): [BELIEF]\nRAW DATA: [where it lives / attached]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Try to reproduce the belief from the raw data. Show the query or calculation and the result.\n2. Which alternative explanations the same data supports just as well or better.\n3. Where the belief is a rough approximation: which segments, periods or cases it doesn't hold for.\n4. The one analysis that would best distinguish our explanation from the best alternative.\n5. Verdict: confirmed / partly / refuted / not enough data. Leave the conclusions about what to do to me."}, {"id": "18.4", "title": "New knowledge, tested on unseen data", "meta": "`[AGENT WITH TOOLS]` · DURING", "notes": [], "after": [], "short": null, "full": "You're already inside the data. Find something we don't know yet, and prove it's not a fluke.\n\nQUESTION: [e.g. “the earliest churn signal”]\nDATA: [where it lives]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Before the analysis, set aside part of the data (for example, the most recent period), don't look at it, and tell me what you set aside.\n2. Build a model or simulation that reproduces the past from the remaining data. Show how accurately.\n3. Find a signal that isn't part of our current understanding.\n4. Test it on the held-out data: does it predict what the model never saw. Raw numbers.\n5. Why this could be a false finding (data leakage, overfitting, multiple comparisons) and what does or doesn't rule that out."}]}, {"n": 19, "title": "Going wider", "when": "**When to use:** BEFORE. The task sits in one field, but a strong solution might come from another. Multi-agent tools make it cheap to bring in several fields.", "keep": "**Keep in mind:**\n- Turn the noun into a verb. A review isn't “a presentation”; it's “convince busy people of a cause-and-effect story and help them decide under uncertainty in 30 minutes”. The verbs hint at which fields could help.\n- Assemble a team of fields and methods, not a role-play. Not “write like a short seller” but “do what a short seller does when researching a position”. Role-play makes the conversation stranger and the result no better.\n- For this, the model needs a computer where it can install software, and access to data. Without that, range degenerates into styling the text.", "intro": [], "prompts": [{"id": "19.1", "title": "Nouns into verbs", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Help me see this task more broadly than its own field.\n\nTASK / ARTIFACT: [e.g. “the quarterly presentation”]\n\n1. Describe the task with verbs, not a noun: what actually has to happen to the people, the data or the system. Give 2–3 phrasings.\n2. For each phrasing, 3 fields beyond the obvious one where those verbs are the core work, and a specific method or tool from each that could be applied here.\n3. Which method is the most unexpected yet still testable. How I'll know it improved the result."}, {"id": "19.2", "title": "Assemble a team of methods", "meta": "`[ANY CHAT]`, ideally `[AGENT WITH TOOLS]` or a multi-agent environment · BEFORE", "notes": ["Keep the lineup within your checking capacity: [13.1](#13-multi-agent-work-and-orchestration)."], "after": [], "short": null, "full": "Imagine a great deal depends on the result. Which specialists would be brought together for this task? I need their METHODS, not their voices: no role-play and no imitating their style.\n\nTASK: [TASK]\nWHAT AN “EXCELLENT RESULT” MEANS: [CRITERIA]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. The lineup: 4–6 specialists from different fields (no more than I can check), including at least one adversarial one: someone who makes a living finding weaknesses (for example, a short seller, a forensic accountant, a penetration tester, a journal reviewer).\n2. For each: the specific procedure they would run on the task, on what raw material, and what they would hand in at the end.\n3. Run these procedures one by one (or hand them out to subagents, each getting only its own procedure). The results are artifacts, not opinions: calculations, findings, checks.\n4. Where the procedures contradict each other, and what decision about that contradiction I need to make."}]}, {"n": 20, "title": "Red teaming with adversarial agents", "when": "**When to use:** DURING / AFTER (20.3 is set up BEFORE), when the cost of a mistake is high or there's too much output to read all of it. How this differs from self-critique ([7.2](#7-writing-code-and-debugging)), a stress test ([6.2](#6-architecture-and-design)), a counterargument ([11.1](#11-high-stakes-decisions)) and a synthesis audit ([10.2](#10-research-and-document-synthesis)): those give an opinion or a cross-check. Here the agent has an inverted success criterion and must bring back a reproducible failure. For a business problem: adversarial specialists (20.2); for code: the breaker (20.1); for the full cycle: the protocol with a judge (20.3).", "keep": "**Keep in mind:**\n- Inverted incentive: the adversarial agent only wins by proving the work is bad. For it, “found no problems” is a loss, not politeness.\n- A finding that can't be reproduced doesn't count. Proof is a failing test, a counterexample from the data, a specific input that breaks it. A tool is the judge, not a model.\n- The breaker doesn't see the author's reasoning and doesn't fix anything. The author doesn't sign off on their own work. The final call is yours, ideally after a fresh checker in a separate context has looked.\n- Without an external judge, a red team turns into a generator of plausible complaints. Without a limit, it turns into an endless loop.", "intro": [], "prompts": [{"id": "20.1", "title": "The breaker", "meta": "`[NEW CHAT / OTHER MODEL]` or a subagent, ideally `[AGENT WITH TOOLS]` · AFTER", "notes": ["In Claude Code: “Run a separate subagent with none of our history using this prompt; return its failing tests to me as they are.”"], "after": [], "short": null, "full": "Your task: find reproducible failures in the code below. Success is measured only by the number and severity of failures confirmed by actually running them. Reporting “no problems found” is a loss for you, but a made-up failure is an even bigger loss.\n\nCODE / DIFF / WHERE IT LIVES: [CODE]\nWHAT IT PROMISES TO DO: [REQUIREMENT]\nLIMIT: [time / number of attempts]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nRules:\n1. Don't fix anything and don't suggest fixes. Only break.\n2. Every finding is a test or an exact sequence of steps that fails on the current code. Run it and show the output. If you didn't run it, mark it “NOT RUN” and treat the finding as a hypothesis, not a result.\n3. Look where authors don't: boundary values, order of operations, concurrency, dependency failures, malformed input, gaps between behavior and promise.\n4. For each failure: input → expected → actual → severity (what breaks for the user).\n5. At the end: confirmed failures (with output), hypotheses that weren't run, what you attacked without breaking it (which inputs and scenarios), and which areas you did NOT get to attack."}, {"id": "20.2", "title": "An adversarial review of a decision or document", "meta": "`[NEW CHAT / OTHER MODEL]` · DURING", "notes": [], "after": [], "short": null, "full": "Check the text below using the procedures of professions that make money from other people's mistakes (a short seller, a forensic accountant, a journal reviewer). Don't imitate their voice; use only their methods. Success means finding a claim that doesn't survive scrutiny.\n\nDOCUMENT / DECISION / PLAN: [TEXT]\nDATA AND SOURCES, IF ANY: [DATA]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. List the key claims the conclusion rests on (no more than 7).\n2. For each: which professional procedure tests it (checking numbers against the source, looking for contradictions between sections, testing assumptions, comparing with the base rate).\n3. Run the procedures where there's data. Show the calculation or the quote.\n4. The outcome for each claim: holds up / doesn't hold up (with proof) / can't be checked without [what].\n5. The one claim that, if false, brings everything down. How to check it before deciding."}, {"id": "20.3", "title": "The Blue/Red protocol with a judge", "meta": "`[AGENT WITH TOOLS]` with subagents, or several chats · BEFORE → AFTER", "notes": ["Red's prompt: 20.1 for code, 20.2 for documents."], "after": [], "short": "Split the work between three participants: the builder (does the work), the breaker (separate, with none of the builder's history, wins only with a reproducible failure), and the judge (a tool: tests/benchmark/data, fixed in advance). Loop: builder → breaker → judge → fix, until the breaker finds nothing in [N] attempts or the limit runs out. The builder doesn't approve its own work. Don't invent output: if you didn't run it, write “NOT RUN”. The final “yes” is mine.", "full": "Organize the work using the Blue/Red protocol with an external judge.\n\nTASK: [TASK]\nTHE JUDGE (what objectively decides pass or fail): [tests / benchmark / check against data / “propose one and show it to me before we start”]\nLIMITS: [maximum rounds, time]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Blue (the builder) does the work and hands in the artifact + how to run it.\n2. Red (the breaker) is a separate agent or chat with NONE of Blue's history. It gets only the artifact, the requirement and the judge. It wins only with a reproducible failure: a failing test, a counterexample, or an input it gets wrong.\n3. The judge runs on every Red finding: confirmed / doesn't reproduce. Anything unconfirmed doesn't get worked on.\n4. Blue fixes what was confirmed and adds the case to the judge as a new test or check so it doesn't come back. Blue doesn't change or delete the judge's existing checks, except with my agreement.\n5. Stop when: Red finds nothing in [N] attempts, OR the limit runs out, OR the same problem comes back twice with no new evidence; then call me.\n6. Report to me: the rounds, the confirmed failures and their fixes, what Red did NOT attack, the judge's final output. The decision to ship is mine."}]}, {"n": 21, "title": "Fresh eyes", "when": "**When to use:** ONGOING during your first weeks somewhere new or on a new project, and DURING any conversation where you hear “that's impossible” or “we already tried”.", "keep": "**Keep in mind:**\n- A newcomer sees friction and opportunities that old-timers have stopped noticing. The advantage is temporary: in time you'll become an old-timer too and stop seeing it. Write down the oddities while they still seem odd.\n- “Impossible” often rests on several reasons at once: some true, some common knowledge nobody ever checked. Take them apart one by one and check the cheapest first: just ask whoever makes the call.\n- “I already tried” isn't a check. Conditions change, and the biggest change right now is that execution has become cheap.\n- How this differs from [18.3](#18-going-deeper): there, a causal belief is tested against raw data; here, “impossible” rests on people and rules, and you test it by asking the owner. It doesn't conflict with [5.1](#5-a-new-unfamiliar-task); it sets the order: first write down what's odd before you get used to it, then learn.\n- The oddities have to come from you, not the model: the AI helps you sort them and check them, but not invent them. Otherwise it's someone else's conclusion again instead of yours.", "intro": ["Blocks 21–22 are for people without much standing in their organization, and for anyone who has just joined a new team, project or codebase."], "prompts": [{"id": "21.1", "title": "A fresh-eyes log", "meta": "`[ANY CHAT]` · ONGOING (your first weeks somewhere new)", "notes": [], "after": [], "short": null, "full": "I'm new to this team/project and I'm writing down what seems odd to me before I get used to it. Help me turn my notes into testable hypotheses. Don't add oddities of your own.\n\nWHERE I AM: [company / team / project / product]\nMY NOTES (what seemed odd, awkward, slow, confusing): [MY NOTES]\n\n1. Group the notes: friction for users / friction for the team / “that's how we do it” with no visible reason / an opportunity.\n2. For each: the most plausible reason it's done this way, or whether it's simply that nobody has revisited it.\n3. How to check cheaply: who to ask, what data to look at, what to try. Phrase the question so I can ask it as a newcomer, without sounding accusatory.\n4. The three notes with the biggest potential impact on the team's goals, and why.\n5. What you DON'T know about the context that could make your assessment wrong."}, {"id": "21.2", "title": "Rechecking “impossible” and “we already tried”", "meta": "`[ANY CHAT]` · DURING", "notes": [], "after": [], "short": null, "full": "On the team, the idea below is considered impossible, or is said to have failed already. Work out what that belief rests on. Don't take the idea's side in advance and don't defend the status quo: take it apart and find what to check.\n\nIDEA: [IDEA]\nWHY IT'S CONSIDERED IMPOSSIBLE / WHAT HAPPENED LAST TIME: [WHAT I HEARD]\nMY HYPOTHESIS (which reason I think doesn't hold up): [MY HYPOTHESIS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Break “impossible” into separate reasons: technical, organizational (someone's presumed “no”), resources, historical (“we tried”).\n2. Label each reason: FACT (verified, there's a source) / ASSUMPTION ABOUT PEOPLE OR RULES / HEARSAY. For each, the owner (who can confirm or remove it directly) and one question for them or a minimal experiment.\n3. For “we already tried”: what has changed since then (cost of execution, tools, people, requirements)? What actually broke back then: the idea, or the way it was pushed?\n4. The cheapest check of the weakest reason. If it's a question for a person, phrase it.\n5. Which reasons are probably true, and how to work around them rather than argue with them."}]}, {"n": 22, "title": "Prototype instead of permission", "when": "**When to use:** BEFORE building (22.1) and AFTER the prototype is ready (22.2): you have an idea but not the standing to get the organization to bet on it, or showing a working thing is faster than a long approval process.", "keep": "**Keep in mind:**\n- Execution isn't expensive anymore. A working prototype skips the cycle of “requirements doc → approvals → fighting for designer and manager time”.\n- Don't start from the backlog; start from what the organization is actually trying to achieve. A good proxy for the right altitude is your manager's manager's goals. This is “altitude” in a different sense than in [17.1](#17-aiming-higher): there it's the level of what you ask the model for, here it's the level of the organization's goals. Use the task ladder from 17.1.\n- One idea per prototype. The classic mistake is hiding three great ideas among twenty bad ones. The point of the prototype is to get the idea across so that both the opportunity and the fact that you can lead it are obvious.\n- A prototype is an argument, not a product. You still have to be able to explain what in it is real and what is a stub, and defend the idea under your own name ([11.3](#11-high-stakes-decisions)). Otherwise a fast prototype turns into comprehension debt with a demo.\n- You're skipping approval for the idea, not the checks. Stakes still follow [3.1](#3-delegate-or-not); a winning prototype only goes to production the normal way: [9.2](#9-verification) → [7.1](#7-writing-code-and-debugging) → [15.1](#15-finishing-any-task).", "intro": [], "prompts": [{"id": "22.1", "title": "One idea, one prototype", "meta": "`[ANY CHAT]`, ideally `[AGENT WITH TOOLS]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Help me cut a prototype down to one idea that can be built over a weekend. Don't start building yet. Don't come up with ideas for me.\n\nTHE IDEA (in one sentence): [IDEA]\nWHICH ORGANIZATIONAL GOAL IT SERVES (as I understand it; what I know about the goals one level above my manager): [GOAL]\nWHAT I WANT TO PUT INTO THE PROTOTYPE: [LIST OF FEATURES / PARTS]\nWHO NEEDS TO GET THE IDEA FROM THE PROTOTYPE: [WHO MAKES THE DECISION]\n\n0. Goal check: if it succeeds, how much would the idea change the odds of reaching the goal: radically, or is it a backlog improvement? Don't soften it. If the goal is vague, phrase a question for me to ask, say which role to ask, and stop.\n1. State the core of the idea in one sentence: what a busy person should see and understand in the first two minutes.\n2. Split my list into: “the idea doesn't make sense without this” / “a separate idea, set it aside” / “infrastructure that can be faked with a stub”.\n3. If the list contains more than one idea, name them separately and ask which one I choose. Stop until I answer.\n4. The minimal scope of the prototype: what's real, what's a stub. Stubs will be honestly labeled in the demo.\n5. Boundaries: the prototype doesn't go to production and doesn't touch real users or production data. What's needed to guarantee that.\n6. The prototype's success criterion: what decision or question from leadership it should trigger."}, {"id": "22.2", "title": "The prototype as an argument", "meta": "`[SAME CHAT]` or `[ANY CHAT]` with a description of the prototype · AFTER", "notes": [], "after": [], "short": null, "full": "The prototype is ready. Help me turn it into an argument for the people who decide, and check that I can defend it myself.\n\nTHE PROTOTYPE (what it does, what's real in it, what's a stub): [DESCRIPTION]\nTHE ORGANIZATIONAL GOAL IT SERVES: [GOAL]\nWHO I'M SHOWING IT TO: [WHO DECIDES]\n\n1. A 3–5 minute demo script: what problem to open with, what to show, where to end. One idea, no distractions.\n2. An explicit list: what in the prototype is real, what's a stub, what doesn't scale. I'll show it myself instead of waiting to be asked.\n3. 5 questions this person will ask (cost, risks, who'll maintain it, why it wasn't done before, what's next). Wait for my answers, then mark where I'm shaky.\n4. What exactly I'm asking for at the end: time, people, a decision. One sentence.\n5. What's missing to make it clear that I'm the one who can lead this."}]}], "extra": {"How to use": "- **Placeholders.** Any `[PLACEHOLDER]` can be replaced with “see above in this chat” or “I don't know”. Don't skip the fields where you do the thinking: `[MY HYPOTHESIS]`, `[THESIS]` (12.1), `[MY POSITION]` (11.1), `[MY SUMMARY]` (10.3), `[MY EXPLANATION]` (5.3), lines picked at random `[FILE:LINE]` (8.2), `[MY UNVERIFIED THING]` (15.1), `[ACCEPTANCE BAR]` (18.2), `[BELIEF]` (18.3), `[MY NOTES]` (21.1), `[IDEA]` (21.2, 22.1) and `[GOAL]` (12.1, 22.1, 22.2). Fill them in before you send, even with a bad guess. This is one of the core techniques here.\n- **Environment labels** sit under each prompt's title:\n  - `[ANY CHAT]`: works anywhere, in a new chat or the current one.\n  - `[SAME CHAT]`: paste into the chat where the work happened. The model needs the history.\n  - `[NEW CHAT / OTHER MODEL]`: needs fresh eyes with no history: a new chat, a different model, or a subagent.\n  - `[AGENT WITH TOOLS]`: needs to run commands or access files. It still works without tools, but the checks will come back to you as a list of commands.\n- **Phases:** BEFORE (before you hand off the task) / DURING (the AI has produced something) / AFTER (the AI says it's done) / ONGOING (habits).\n- **Short** is a 2–3 line version of a long prompt for when you don't have time for the full one.\n- **The HONESTY line** is identical in every full prompt about checks, command output and sources (one-liners and Short versions carry a one-sentence form). Don't delete it: without it, a model can “show” you output from something that never ran.\n- **Combine them.** Not sure what to pick? Use [2.2](#2-universal-multi-prompt) at the start and [15.1](#15-finishing-any-task) at the end. No time even for that? Use the [one-liners](#0-one-liners).", "Contents": "- [Situation and prompt](#situation-and-prompt)\n- [0. One-liners](#0-one-liners)\n- [1. Standing instructions](#1-standing-instructions)\n- [2. Universal multi-prompt](#2-universal-multi-prompt)\n- [3. Delegate or not](#3-delegate-or-not)\n- [4. Framing the task and the brief](#4-framing-the-task-and-the-brief)\n- [5. A new unfamiliar task](#5-a-new-unfamiliar-task)\n- [6. Architecture and design](#6-architecture-and-design)\n- [7. Writing code and debugging](#7-writing-code-and-debugging)\n- [8. Code review and PRs](#8-code-review-and-prs)\n- [9. Verification](#9-verification)\n- [10. Research and document synthesis](#10-research-and-document-synthesis)\n- [11. High-stakes decisions](#11-high-stakes-decisions)\n- [12. Writing and content](#12-writing-and-content)\n- [13. Multi-agent work and orchestration](#13-multi-agent-work-and-orchestration)\n- [14. Long sessions and handing off context](#14-long-sessions-and-handing-off-context)\n- [15. Finishing any task](#15-finishing-any-task)\n- [16. Calibrating your skills](#16-calibrating-your-skills)\n- [17. Aiming higher](#17-aiming-higher)\n- [18. Going deeper](#18-going-deeper)\n- [19. Going wider](#19-going-wider)\n- [20. Red teaming with adversarial agents](#20-red-teaming-with-adversarial-agents)\n- [21. Fresh eyes](#21-fresh-eyes)\n- [22. Prototype instead of permission](#22-prototype-instead-of-permission)\n- [The 30-second checklist](#the-30-second-checklist)\n- [New prompt template and editing rules](#new-prompt-template-and-editing-rules)\n- [Glossary](#glossary)\n- [Changelog](#changelog)", "Situation and prompt": "| Situation | Prompt |\n|---|---|\n| A second to ask something after the AI answers | [0.1–0.14](#0-one-liners) |\n| Setting up CLAUDE.md, AGENTS.md, custom instructions or a project | [1.1](#1-standing-instructions) |\n| A non-trivial task and no time to pick | [2.2](#2-universal-multi-prompt) to start, [2.1](#2-universal-multi-prompt) for the full cycle |\n| Can I hand off the whole task? | [3.1](#3-delegate-or-not) |\n| Something small where a mistake costs nothing | [3.2](#3-delegate-or-not) |\n| I'm not fully sure what I want | [4.1](#4-framing-the-task-and-the-brief) |\n| Two rounds of edits and it's still not right | [4.3](#4-framing-the-task-and-the-brief), then [4.2](#4-framing-the-task-and-the-brief) |\n| Unfamiliar territory, no reference points | [5.1](#5-a-new-unfamiliar-task) |\n| Choosing an architecture or approach | [6.1](#6-architecture-and-design), then [6.2](#6-architecture-and-design) in a new chat |\n| An agent is writing code | [9.2](#9-verification), then [7.1](#7-writing-code-and-debugging), then [7.2](#7-writing-code-and-debugging) in a new chat |\n| A bug or an incident | [7.4](#7-writing-code-and-debugging) |\n| I need to understand someone else's or generated code | [7.3](#7-writing-code-and-debugging) |\n| Reviewing a PR before merging | I read the diff myself, then [8.1](#8-code-review-and-prs), then [8.2](#8-code-review-and-prs) |\n| The AI says “done” or “tests are green” | [9.1](#9-verification) |\n| The AI summarized lots of documents or interviews | [10.1](#10-research-and-document-synthesis) or [10.2](#10-research-and-document-synthesis) |\n| A big decision, money, strategy, and I have a firm position | [11.1](#11-high-stakes-decisions) in 2–3 models, [11.3](#11-high-stakes-decisions) |\n| Writing that goes out under my name | [12.1](#12-writing-and-content), [12.2](#12-writing-and-content) |\n| Several agents and I can't keep up with checking | [13.1](#13-multi-agent-work-and-orchestration), [13.3](#13-multi-agent-work-and-orchestration) |\n| Handing a subtask to another agent | [13.2](#13-multi-agent-work-and-orchestration) |\n| A long session and I've lost the thread | [14.1](#14-long-sessions-and-handing-off-context) |\n| Running out of context, moving to a new chat | [14.2](#14-long-sessions-and-handing-off-context) |\n| Closing a task, merging, shipping | [15.1](#15-finishing-any-task) |\n| Once a week or once a month | [16.1](#16-calibrating-your-skills), [16.2](#16-calibrating-your-skills) |\n| I'm doing a “task”, but what I need is the outcome behind it | [17.1](#17-aiming-higher) |\n| I keep giving the agent the same thing over and over | [17.2](#17-aiming-higher) |\n| We run a process out of habit and I want it better | [17.3](#17-aiming-higher) |\n| It needs to be genuinely good, not just a lot | [18.1](#18-going-deeper), then [18.2](#18-going-deeper) |\n| Decisions rest on a belief nobody has tested | [18.3](#18-going-deeper) |\n| I want to find what we don't know in the data | [18.4](#18-going-deeper) |\n| A solution is stuck inside one field | [19.1](#19-going-wider), [19.2](#19-going-wider) |\n| High stakes, I want someone to try to break the code | [20.1](#20-red-teaming-with-adversarial-agents) |\n| A document or decision has to survive a hostile review | [20.2](#20-red-teaming-with-adversarial-agents) |\n| A big task and I want a build–break–judge loop | [20.3](#20-red-teaming-with-adversarial-agents) |\n| I'm new and a lot of things look odd | [21.1](#21-fresh-eyes) |\n| I hear “that's impossible” or “we already tried” | [21.2](#21-fresh-eyes) |\n| I have an idea but not the clout to push it | [22.1](#22-prototype-instead-of-permission), then [22.2](#22-prototype-instead-of-permission) |", "The 30-second checklist": "1. Am I solving the right problem, and how will I know I'm done?\n2. Did I write down my hypothesis before asking the AI?\n3. Is the AI helping me think or thinking for me, and is that my deliberate choice?\n4. Did I define “verified” in advance and put time for my own check into the plan?\n5. Did I look at the real output (log, terminal, CI) myself before the summary? Do I know what the green check proved and what it didn't?\n6. What would have to be true for this to be wrong, and did I check that with a test rather than the model's confidence?\n7. Did I hear a counterargument from another angle (a different model, a different chat)?\n8. Do I know which decisions and assumptions the AI made for me?\n9. Did I write down, myself, one thing the AI didn't check?\n10. Would I put my name on this in front of the person who'll maintain it, or was I just persuaded by the polished format?\n11. Did I ask for the most ambitious version (higher, deeper, wider) that I can check with an external judge rather than the model's word?", "New prompt template and editing rules": "**Numbering rules:**\n- A block or prompt number, once assigned, is never reused or renumbered: the situation table and other prompts link to it.\n- Don't erase a removed prompt. Keep its heading with the note `(removed YYYY-MM-DD: reason, replaced by → X.Y)` and delete the body.\n- A new prompt goes at the end of its block, with the next free number. A new block goes after the last block (23, 24, …), before the checklist. Add it to the contents, to an island in `ISLES` in `src/template.html` (or the build stops) and, if needed, to the “Situation and prompt” table.\n- Write block headings without quotes, colons or dashes so the anchor links don't break.\n- Record every change in the “Changelog”.\n\n**Block and prompt template:**\n\n````text\n## N. Block name\n\n**When to use:** [the situation in one line]\n\n**Keep in mind:**\n- [2–6 points]\n\n### N.M Prompt name\n`[ANY CHAT | SAME CHAT | NEW CHAT / OTHER MODEL | AGENT WITH TOOLS]` · BEFORE | DURING | AFTER | ONGOING\n\nShort: (for long prompts, a 2–3 line version in a separate text block, or a link to the prompt that serves as one)\n\n```text\n[What to do and what NOT to do.]\n\nFIELD: [PLACEHOLDER]\nMY HYPOTHESIS: [MY HYPOTHESIS]   ← if relevant\nHONESTY: ...                     ← word for word, if the prompt is about checks, output or sources\n\n1. ...\n2. ...\n[Where to stop and wait for me.]\n```\n````", "Glossary": "| Term | Meaning |\n|---|---|\n| Cognitive offloading | You delegate the task but own the result. Healthy. |\n| Deferral | The tool's output becomes your input and stops being a hypothesis. |\n| Cognitive surrender | The AI's output quietly becomes yours, and you don't feel any need to check it. |\n| Cognitive debt | The debt of understanding that builds up when you hand off your thinking, including when you sign off on specs and strategies. |\n| Comprehension debt | Cognitive debt applied to code: the code is clean, the tests are green, and nobody understands it. |\n| Erosion of the shared theory of the system | The team loses its shared understanding of the system. It surfaces when things change. |\n| Rebuilding understanding on demand | Instead of holding a model of the whole codebase, ask for an explanation of the slice you need. |\n| Blind spot pass | You give the model everything you know and it looks for your unknown unknowns. |\n| Verification loop | Give the agent a way to check its own work: tests, e2e, an actual run. |\n| The real-review rule | If you can't say what the checks will miss, ask for a real review, not a quick approval. |\n| Intent debt | Unstated goals, constraints and motives that aren't in the task framing. |\n| Orchestration tax | The gap between what the agents generate and what you're prepared to put your name on. |\n| Paradox of supervision | Supervising AI takes the very coding skills that waste away from leaning on AI too much. |\n| Speed / Altitude / Depth / Range | Four kinds of ambition: the same thing faster; higher in abstraction (the outcome instead of the task); deeper (the methods of the best professionals); wider (methods from other fields). |\n| External judge | Don't ask the model to grade itself; the best judge is a tool it runs and gets an answer from immediately. |\n| Nouns into verbs | Describe the task as an action to see which fields could help. |\n| Red team | The adversarial part of a team whose job is to find weaknesses (for example, a short seller or a forensic accountant). An adversarial agent has an inverted success criterion: it has to bring back a reproducible failure. |\n| Newcomer's fresh eyes | Newcomers notice friction and opportunities that old-timers no longer see; organizations need an influx of “naive” people. |\n| The old-timer trap | Your own “I already tried” turns into an untested belief; a newcomer with the same idea simply asks. |", "Changelog": "| Date | Version | What changed | Why |\n|------|---------|--------------|-----|\n| 2026-11-11 | 1.0 | First public release: 23 blocks, 69 prompts, the situation table, the 30-second checklist, the glossary | |"}}</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- islands: groups of blocks along the work lifecycle ---------- */
const ISLES=[
 {k:'start',name:'Start',blocks:[0,1,2],why:'Not sure what to pick: a one-liner, standing instructions, or the universal multi-prompt.'},
 {k:'frame',name:'Framing',blocks:[3,4,5],why:'BEFORE the task: whether to hand it off, how to frame it, what to do in unfamiliar territory.'},
 {k:'make',name:'Making',blocks:[6,7,12],why:'Decisions, code and writing while the AI does the work.'},
 {k:'check',name:'Checking',blocks:[8,9,10,11,20],why:'The AI says “done”: review, evidence, synthesis, stakes, adversarial checks.'},
 {k:'scale',name:'Scale',blocks:[13,14],why:'Multiple agents and long sessions.'},
 {k:'finish',name:'Finish and grow',blocks:[15,16],why:'Close out the task and keep your skills calibrated.'},
 {k:'ambit',name:'Ambition',blocks:[17,18,19],why:'Ask AI for more: higher, deeper, wider.'},
 {k:'fresh',name:'Fresh eyes',blocks:[21,22],why:'Fresh eyes and a prototype instead of permission.'},
];
const ISLE_COL={start:'#D97757',frame:'#C2924A',make:'#8F9A4C',check:'#C25E5E',scale:'#5E8FB0',finish:'#7C6FB3',ambit:'#B76E9A',fresh:'#4F9C8A'};
const blockIsle={};ISLES.forEach(i=>i.blocks.forEach(b=>blockIsle[b]=i));

/* ---------- index prompts ---------- */
const P={},order=[];
D.blocks.forEach(b=>b.prompts.forEach(p=>{p.block=b.n;P[p.id]=p;order.push(p.id)}));
const B={};D.blocks.forEach(b=>B[b.n]=b);

const PHASES=['BEFORE','DURING','AFTER','ONGOING'];
const ENVS=[['ANY CHAT','any'],['SAME CHAT','same'],['NEW CHAT / OTHER MODEL','new'],['AGENT WITH TOOLS','agent']];
const phRe=/(?<![A-Z])(BEFORE|DURING|AFTER|ONGOING)(?![A-Z])/g;
order.forEach(id=>{const p=P[id];
  let src=p.meta||p.title;
  if(p.block===0){const own=p.title.replace(/`[^`]*`/g,' ');src=phRe.test(own)?p.title:p.title+' '+B[0].when;phRe.lastIndex=0}
  p.phases=[...new Set([...src.replace(/`[^`]*`/g,' ').matchAll(phRe)].map(m=>m[1]))];
  if(p.block===0&&!/`\[/.test(p.title)) p.envs=['same']; else p.envs=ENVS.filter(e=>(p.meta+p.title).includes('['+e[0]+']')).map(e=>e[1]);
  if(p.block===0&&/`\[/.test(p.title)&&!p.envs.length)p.envs=['same'];
});

/* ---------- routes from “Situation and prompt” ---------- */
const linkRe=/\[([^\]]+)\]\((#[^)]+)\)/g;
function anchorToBlock(h){const m=decodeURIComponent(h).match(/^#(\d+)-/);return m?+m[1]:null}
function refId(text,href){ // "2.2" -> prompt, "0.1–0.14" -> block 0, other -> block
  if(P[text])return {t:'p',id:text};
  const bn=anchorToBlock(href);return bn==null?null:{t:'b',id:bn,label:text};
}
const ROUTES=[];
D.extra['Situation and prompt'].split('\n').filter(l=>/^\| (?!Situation|---)/.test(l)).forEach((l,i)=>{
  const cells=l.split('|').slice(1,-1).map(s=>s.trim());
  const sit=cells[0],cell=cells[1];const steps=[];let last=0,m;linkRe.lastIndex=0;
  const parts=[];while((m=linkRe.exec(cell))){parts.push({pre:cell.slice(last,m.index),text:m[1],href:m[2]});last=linkRe.lastIndex}
  const tail=cell.slice(last);
  parts.forEach((pt,j)=>{
    let pre=pt.pre;let conn=null;
    // text before link: "I read the diff myself, then " or ", then " or " or "
    const cm=pre.match(/^(.*?)(,\s*then\s*|\s*then\s*|,\s*|\s+or\s+)$/);
    let lead=pre,c='';if(cm){lead=cm[1];c=cm[2].trim().replace(/^,\s*/,'')||','}
    if(j===0&&lead.trim()){steps.push({manual:lead.trim()});conn=c||null}
    else if(j>0){ // lead belongs to previous step as note
      if(lead.trim())steps[steps.length-1].note=lead.trim();conn=c||','}
    else conn=c||null;
    const r=refId(pt.text,pt.href);steps.push({...r,conn,raw:pt.text});
  });
  if(tail.trim())steps[steps.length-1].note=tail.trim();
  ROUTES.push({i,sit,cell,steps});
});
const inRoutes={};const addR=(key,i)=>(inRoutes[key]=inRoutes[key]||[]).includes(i)||inRoutes[key].push(i);
ROUTES.forEach(r=>r.steps.forEach(s=>{if(s.t==='p')addR(s.id,r.i);else if(s.t==='b'){addR('b'+s.id,r.i);B[s.id].prompts.forEach(p=>addR(p.id,r.i))}}));
// the route's id line uses the table's connectors: “then” → arrow, “or”, “,”
const routeIds=r=>r.steps.filter(s=>s.t).map((s,j)=>(j?(s.conn==='or'?' or ':s.conn===','?', ':' → '):'')+(s.t==='p'?s.id:'0.x')).join('');
function routeIsle(r){const c=new Map();r.steps.filter(s=>s.t).forEach(s=>{const is=blockIsle[s.t==='p'?P[s.id].block:s.id];c.set(is,(c.get(is)||0)+1)});let best=ISLES[0],n=0;c.forEach((v,k)=>{if(v>n){n=v;best=k}});return best}
// “← →” paging follows the island grouping
const BORDER=ISLES.flatMap(is=>is.blocks);
const RORDER=ISLES.flatMap(is=>ROUTES.filter(r=>routeIsle(r)===is));

/* ---------- cross references (explicit links + next step in routes) ---------- */
function refsIn(txt){const out=[];let m;linkRe.lastIndex=0;while((m=linkRe.exec(txt||''))){const r=refId(m[1],m[2]);if(r)out.push(r)}return out}
order.forEach(id=>{const p=P[id];const seen=new Set();p.next=[];
  const add=(r,how)=>{const k=r.t+r.id;if(r.t==='p'&&r.id===id||seen.has(k))return;seen.add(k);p.next.push({...r,how})};
  [p.meta,...p.notes,...(p.after||[]),p.title].forEach(t=>refsIn(t).forEach(r=>add(r,'link')));
  ROUTES.forEach(rt=>rt.steps.forEach((s,j)=>{if(s.t==='p'&&s.id===id){const n=rt.steps[j+1];if(n&&n.t&&n.conn!=='or'&&n.conn!==',')add(n,'route')}}));
  // prompt numbers mentioned in plain text without a link: “prompt 9.2”
  [p.meta,...p.notes,...(p.after||[]),p.full].forEach(t=>{for(const m of (t||'').replace(linkRe,'').matchAll(/(?<![\d.])(\d{1,2}\.\d{1,2})(?![\d.])/g))if(P[m[1]])add({t:'p',id:m[1]},'mention')});
});

/* ---------- markdown (minimal, never rewrites the text) ---------- */
function inline(s){
  let h=esc(s);
  h=h.replace(/`([^`]+)`/g,(m,c)=>envChip(c)||'<code>'+c+'</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\[([^\]]+)\]\((#[^)]+)\)/g,(m,t,href)=>{const r=refId(t,href);return r?`<a href="${r.t==='p'?'#p'+r.id:'#b'+r.id}" data-go>${t}</a>`:t});
  return h;
}
function envChip(c){const e=ENVS.find(e=>c==='['+e[0]+']');return e?`<span class="env ${e[1]}">${c}</span>`:null}
function md(src){
  const L=src.split('\n');let h='',i=0;
  while(i<L.length){const l=L[i];
    if(!l.trim()||/^-{3,}\s*$/.test(l)){i++;continue}
    if(/^\|/.test(l)){const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);
      const cells=r=>r.split('|').slice(1,-1).map(s=>s.trim());
      h+='<div class="tbl"><table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
    if(/^\s*- /.test(l)){h+='<ul>';while(i<L.length&&/^\s*- /.test(L[i])){let item=L[i].replace(/^\s*- /,'');const ind=L[i].match(/^\s*/)[0].length;i++;
        let sub='';while(i<L.length&&L[i].match(/^\s*/)[0].length>ind&&/^\s*- /.test(L[i])){sub+='<li>'+inline(L[i].replace(/^\s*- /,''))+'</li>';i++}
        h+='<li>'+inline(item)+(sub?'<ul>'+sub+'</ul>':'')+'</li>'}h+='</ul>';continue}
    if(/^\d+\. /.test(l)){h+='<ol>';while(i<L.length&&/^\d+\. /.test(L[i]))h+='<li>'+inline(L[i++].replace(/^\d+\. /,''))+'</li>';h+='</ol>';continue}
    let para=[];while(i<L.length&&L[i].trim()&&!/^(\||\s*- |\d+\. |-{3,}\s*$)/.test(L[i]))para.push(L[i++]);
    h+='<p>'+inline(para.join('\n')).replace(/\n/g,'<br>')+'</p>';
  }return h;
}

/* ---------- prompt rendering ---------- */
const ME=new Set(['MY HYPOTHESIS','THESIS','MY POSITION','MY SUMMARY','MY EXPLANATION','FILE:LINE','MY UNVERIFIED THING','ACCEPTANCE BAR','BELIEF','MY NOTES','IDEA','GOAL']);
function promptHTML(t){
  return esc(t).replace(/\[([A-Z0-9][^\]\n]{1,60})\]/g,(m,inner)=>{
    if(inner!==inner.toUpperCase())return m;
    return `<span class="phd${ME.has(inner)?' me':''}"${ME.has(inner)?' title="You fill this in yourself, before sending"':''}>${m}</span>`;
  });
}
const svgCopy='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>';
const svgMd='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15V9l2.5 3L12 9v6M15.5 9v6m0 0 2-2m-2 2-2-2"/></svg>';
function metaHTML(p){
  if(p.block===0){return ''}
  return inline(p.meta).replace(phRe,'<span class="ph">$1</span>');
}
function titleHTML(p){
  if(p.block!==0)return inline(p.title);
  return inline(p.title).replace(phRe,'<span class="ph">$1</span>');
}
function card(p,ctx={}){
  const hasShort=!!p.short;const lines=p.full.split('\n').length;
  const sitList=(inRoutes[p.id]||[]);const inR=ctx.steps||{};
  // inside a route, skip links to steps already passed; “next step” only points forward
  const refs=p.next.filter(r=>!(r.t==='p'&&inR[r.id]!=null&&inR[p.id]!=null&&inR[r.id]<inR[p.id]));
  const chip=r=>r.t==='p'?`<a class="go" href="${inR[r.id]!=null?'#s'+inR[r.id]:'#p'+r.id}"${inR[r.id]!=null?' data-step="s'+inR[r.id]+'"':''} title="${inR[r.id]!=null?'A step in this route':r.how}">${r.id} ${esc(shortT(P[r.id].title))}</a>`:`<a class="go" href="#b${r.id}" title="${r.how}">${esc(r.label||('Block '+r.id))}</a>`;
  const nx=refs.filter(r=>r.how==='route').map(chip).join(''),see=refs.filter(r=>r.how!=='route').map(chip).join('');
  const rt=[...new Set(sitList)].filter(i=>ctx.route!==i).map(i=>`<a class="go rt" href="#r${i}">${esc(ROUTES[i].sit)}</a>`).join('');
  return `<article class="card" id="p${p.id}" data-id="${p.id}">
  <div class="c-h"><a class="c-id" href="#p${p.id}">${p.id}</a>
    <div class="c-t"><h3>${titleHTML(p)}</h3>${p.meta?`<div class="meta">${metaHTML(p)}</div>`:''}</div>
    <div class="copies">

    </div></div>
  ${p.notes.length?`<div class="notes md">${p.notes.map(md).join('')}</div>`:''}

  ${(nx||see||rt)?`<div class="c-f">${nx?`<span class="grp2"><span class="k">Next step</span>${nx}</span>`:''}${see?`<span class="grp2"><span class="k">See also</span>${see}</span>`:''}${rt?`<span class="grp2"><span class="k">Also useful when</span>${rt}</span>`:''}</div>`:'<div style="height:12px"></div>'}
</article>`;
}
const shortT=t=>t.replace(/`[^`]*`/g,'').replace(/[\s.,]*(BEFORE|DURING|AFTER|ONGOING)\s*$/,'').replace(/[.,]\s*(Ideally|Better|Only)\b.*$/i,'').replace(/[.,]\s*$/,'').trim();

/* ---------- filters ---------- */
let F={ph:null,env:null};
const passes=p=>(!F.ph||p.phases.includes(F.ph))&&(!F.env||p.envs.includes(F.env));
// how many prompts remain if this chip is pressed: empty combinations are disabled
const countWith=(ph,env)=>order.filter(id=>{const p=P[id];return(!ph||p.phases.includes(ph))&&(!env||p.envs.includes(env))}).length;
function fchip(attr,val,label,on,n){return `<button class="chip${on?' on':''}" data-${attr}="${val}" aria-pressed="${on}"${!on&&!n?' disabled title="No prompts match this combination"':''}>${label} <span class="cnt">${n}</span></button>`}
function filtersHTML(){
  return `<div class="filters"><span class="lbl">Phase</span>${PHASES.map(x=>fchip('ph',x,x,F.ph===x,countWith(x,F.env))).join('')}
  <span class="lbl" style="margin-left:10px">Where</span>${ENVS.map(e=>fchip('env',e[1],e[0].replace(' / OTHER MODEL','').toLowerCase(),F.env===e[1],countWith(F.ph,e[1]))).join('')}</div>`;

/* ---------- rail ---------- */
function rail(active,cur){
  let h=`<h4>Map</h4><a class="nav-a${active==='home'?' on':''}" href="#home">All islands</a><a class="nav-a${active==='ref'?' on':''}" href="#ref">Reference: spectrum, checklist, glossary</a><a class="nav-a" href="https://github.com/henryfonda12/AI-Prompt-Map" target="_blank" rel="noopener">GitHub: source, AI coach, feedback ↗</a>`;
  h+=`<h4>Situation → route</h4>`;
  ISLES.forEach(is=>{const rs=ROUTES.filter(r=>routeIsle(r)===is);if(!rs.length)return;
    h+=`<div class="grp"><span class="isle-dot" style="background:${ISLE_COL[is.k]}"></span>${is.name}</div>`;
    rs.forEach(r=>{const rel=cur&&r.steps.some(s=>s.t==='p'&&(s.id===cur||P[s.id].block===+String(cur).replace(/^b/,''))&&(String(cur).startsWith('b')||s.id===cur)||s.t==='b'&&('b'+s.id===cur||P[cur]&&P[cur].block===s.id));h+=`<a class="nav-a${active==='r'+r.i?' on':rel?' rel':''}" href="#r${r.i}"${active==='r'+r.i?' aria-current="page"':''}><span>${esc(r.sit)}</span><span class="ids">${routeIds(r)}</span></a>`})});
  $('#rail').innerHTML=h;
}

function blockView(n,focus){

  const ps=b.prompts.filter(p=>passes(p)||focus==='p'+p.id);const hidden=b.prompts.length-ps.length;
  return `<div class="crumbs"><a href="#home">Map</a> / <span class="isle-dot" style="background:${ISLE_COL[is.k]}"></span> ${is.name}</div>
  <div class="tabs">${is.blocks.map(x=>`<a class="${x===n?'on':''}" href="#b${x}">${x}. ${esc(B[x].title)}</a>`).join('')}</div>
  <section class="bhead"><h2><span class="n">${n}.</span>${esc(b.title)}</h2>
   ${b.when?`<div class="when md">${md(b.when)}</div>`:''}
   ${b.intro.length?`<div class="md">${b.intro.map(md).join('')}</div>`:''}
   ${b.keep?`<details class="keep"${store.get('keepOpen',false)?' open':''}><summary>Keep in mind</summary><div class="md">${md(b.keep.replace(/^\*\*Keep in mind:\*\*\n?/,''))}</div></details>`:''}

  <nav class="pager">${prev?`<a href="#b${prev.n}"><small>← ${prev.n}</small>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="r" href="#b${next.n}"><small>${next.n} →</small>${esc(next.title)}</a>`:''}</nav>`;
}
function routeView(i){

    const envs=s.t==='p'?P[s.id].envs.map(e=>`<span class="env ${e}">${ENVS.find(x=>x[1]===e)[0].toLowerCase()}</span>`).join(' '):'';

  return `<div class="crumbs"><a href="#home">Map</a> / <span class="isle-dot" style="background:${ISLE_COL[is.k]}"></span> ${is.name} / route</div>

function tmpl(s){const i=s.indexOf('````text');const j=s.lastIndexOf('````');

let current='';

  current=h+q;
}
let sy;const saveY=()=>{try{history.replaceState({y:scrollY},'')}catch(e){}};
window.addEventListener('scroll',()=>{clearTimeout(sy);sy=setTimeout(saveY,150)},{passive:true});
window.addEventListener('hashchange',()=>{clearTimeout(sy);$('#q').value='';render()});

/* ---------- copy ---------- */
function cardText(id,ver){const p=P[id];return ver==='short'&&p.short?p.short:p.full}
function cardMd(id,ver){const p=P[id];const b=B[p.block];
  const head=p.block===0?`**${p.id}** ${p.title}`:`### ${p.id} ${p.title}\n${p.meta}`;
  return `${head}\n\n\`\`\`text\n${cardText(id,ver)}\n\`\`\``;}
async function copy(text,btn,msg){
  let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(e2){}ta.remove()}
  if(btn){btn.classList.add('ok');setTimeout(()=>btn.classList.remove('ok'),1200)}
  toast(ok?msg:'Couldn\'t copy. Select the text manually.');
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),m.length>40?3200:1600)}

document.addEventListener('click',e=>{
  const sq=e.target.closest('[data-copy]');
  if(sq){const c=sq.closest('.card');const kind=sq.dataset.copy;
    if(kind==='raw'||kind==='rawmd'){const raw=c.dataset.raw;copy(kind==='raw'?raw:'````text\n'+raw+'\n````',sq,'Template copied');return}
    const id=c.dataset.id;const ver=c.querySelector('.ver .on')?.dataset.ver||'full';
    const txt=kind==='text'?cardText(id,ver):cardMd(id,ver);const mine=[...new Set([...txt.matchAll(/\[([^\]\n]+)\]/g)].map(m=>m[1]).filter(x=>ME.has(x)))];
    copy(txt,sq,'Prompt '+id+(ver==='short'?' (short)':'')+' copied'+(kind==='text'?'':' with title and labels')+(mine.length?'. Fill in before sending: ['+mine.join('], [')+']':''));return}
  const vb=e.target.closest('[data-ver]');
  if(vb){const c=vb.closest('.card');c.querySelectorAll('.ver button').forEach(b=>{b.classList.toggle('on',b===vb);b.setAttribute('aria-selected',b===vb)});
    const p=P[c.dataset.id];const t=vb.dataset.ver==='short'?p.short:p.full;const pre=c.querySelector('.pre');pre.querySelector('pre').innerHTML=promptHTML(t);
    const lines=t.split('\n').length;const more=c.querySelector('.more');pre.classList.toggle('clamp',lines>11&&!c.dataset.open);if(more)more.hidden=lines<=11||!!c.dataset.open;return}
  const mo=e.target.closest('.more');
  if(mo){const c=mo.closest('.card');c.dataset.open='1';c.querySelector('.pre').classList.remove('clamp');mo.hidden=true;return}
  const ph=e.target.closest('[data-ph]'),en=e.target.closest('[data-env]');
  if(ph||en){if(ph)F.ph=F.ph===ph.dataset.ph?null:ph.dataset.ph;if(en)F.env=F.env===en.dataset.env?null:en.dataset.env;const y=scrollY;const sel=ph?`[data-ph="${ph.dataset.ph}"]`:`[data-env="${en.dataset.env}"]`;current=null;render();scrollTo(0,y);$('#view '+sel)?.focus({preventScroll:true});return}
  if(e.target.closest('[data-clear]')){e.preventDefault();F={ph:null,env:null};current='x';render();return}
  if(e.target.closest('[data-ckreset]')){e.preventDefault();store.set('ck',[]);current='x';render();return}
  const a=e.target.closest('a[href^="#"]');if(a){clearTimeout(sy);saveY()}
  if(a&&a.getAttribute('href')===location.hash&&$('#q').value===''){const id=a.getAttribute('href').slice(1);const el=document.getElementById(id);if(el){e.preventDefault();el.scrollIntoView({block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
  const st=e.target.closest('[data-step]');if(st){e.preventDefault();const el=document.getElementById(st.dataset.step);if(el){el.scrollIntoView({block:'start'});const c=el.querySelector('.card');if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}}return}
  if(a&&$('#q').value){$('#q').value='';if(a.getAttribute('href')===location.hash){e.preventDefault();render()}}
  if(a)document.body.classList.remove('menu')
});
document.addEventListener('change',e=>{if(e.target.matches('.ck input')){const all=[...document.querySelectorAll('.ck input')].map((x,i)=>x.checked?i:-1).filter(i=>i>=0);store.set('ck',all)}});
document.addEventListener('toggle',e=>{if(e.target.matches('.bhead details.keep'))store.set('keepOpen',e.target.open)},true);
let qt;$('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(render,120)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';e.target.blur();render()}
  if(e.key==='Enter'){clearTimeout(qt);render();const v=e.target.value.trim();if(P[v]){e.target.value='';location.hash='p'+v;render();return}const f=$('#view .go.rt, #view .card');if(f){const h=f.matches('.card')?'p'+f.dataset.id:f.getAttribute('href').slice(1);e.target.value='';e.target.blur();if(location.hash==='#'+h)render();else location.hash=h}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu')){document.body.classList.remove('menu');$('#menuBtn').setAttribute('aria-expanded','false')}if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#menuBtn').addEventListener('click',()=>{const o=document.body.classList.toggle('menu');$('#menuBtn').setAttribute('aria-expanded',o)});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('theme',r.dataset.theme)});
const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;
render();
})();
