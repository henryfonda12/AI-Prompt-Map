<title>AI Prompt Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: sticky terminal bar · left rail = routes by situation · main = island map / block / route */
:root{
  --bg:#FAF9F5; --panel:#FFFFFF; --sunk:#F0EEE6; --line:#E3DFD3; --fg:#1F1E1D; --muted:#6B6A64;
  --accent:#C96442; --accent-soft:#F5E3DA; --accent-fg:#FFFFFF; --think:#9A4A2C;
  --env-same:#3D6FA8; --env-new:#7B5BB0; --env-agent:#4C7A3A; --env-any:#6B6A64;
  --code:#F6F4EE; --shadow:0 1px 0 rgba(31,30,29,.04),0 6px 20px -12px rgba(31,30,29,.18);
  --f-ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F1E1D; --panel:#262624; --sunk:#1A1918; --line:#3A3936; --fg:#F2F0E8; --muted:#A3A097;
  --accent:#D97757; --accent-soft:#3A2A22; --accent-fg:#1F1E1D; --think:#F0A585;
  --env-same:#7FA7D6; --env-new:#B39BDB; --env-agent:#93BE7E; --env-any:#A3A097;
  --code:#1A1918; --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1E1D; --panel:#262624; --sunk:#1A1918; --line:#3A3936; --fg:#F2F0E8; --muted:#A3A097;
  --accent:#D97757; --accent-soft:#3A2A22; --accent-fg:#1F1E1D; --think:#F0A585;
  --env-same:#7FA7D6; --env-new:#B39BDB; --env-agent:#93BE7E; --env-any:#A3A097;
  --code:#1A1918; --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -16px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--f-mono)}
h1,h2,h3{text-wrap:balance;margin:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;white-space:nowrap}
.brand .star{color:var(--accent);font-size:22px;line-height:1}
.brand small{font:500 12px var(--f-mono);color:var(--muted)}
.search{flex:1;max-width:560px;margin-left:auto;position:relative}
.search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:0 64px 0 34px;font:14px var(--f-ui)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:10px;top:10px;color:var(--muted)}
.search kbd{position:absolute;right:8px;top:8px;font:11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--sunk)}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px)}
.rail{border-right:1px solid var(--line);position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow:auto;padding:14px 12px 40px max(12px,env(safe-area-inset-left,0px));background:var(--sunk)}
.rail h4{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px}
.rail h4:first-child{margin-top:4px}
.nav-a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;text-decoration:none;font-size:13.5px;line-height:1.35;cursor:pointer}
.nav-a:hover{background:var(--panel)}
.nav-a.on{background:var(--accent-soft);color:var(--fg)}
.nav-a .ids{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;padding-left:6px}
.nav-a.on .ids{color:var(--accent)}
.isle-dot{width:8px;height:8px;border-radius:2px;flex:none;transform:translateY(-1px);background:var(--accent)}
.grp{font:600 12.5px var(--f-ui);color:var(--fg);margin:12px 8px 2px;display:flex;gap:7px;align-items:center}
.grp .isle-dot{transform:none}

main{min-width:0;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto;display:grid;gap:18px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip .cnt{font:500 10.5px var(--f-mono);opacity:.7}
.chip:disabled{opacity:.4;cursor:default;border-color:var(--line)}
#view:focus{outline:none}

/* home */
.hero{display:grid;gap:10px}
.hero h1{font-size:clamp(22px,3.2vw,30px);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hero p{margin:0;color:var(--muted);max-width:68ch}
.combo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.combo a{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none}
.combo a:hover{border-color:var(--accent)}
.combo b{font:600 12px var(--f-mono);color:var(--accent)}
.combo span{font-size:13.5px}
.isles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.isle{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.isle-h{display:flex;align-items:center;gap:8px}
.isle-h h3{font-size:15px;font-weight:600}
.isle-h small{margin-left:auto;font:11px var(--f-mono);color:var(--muted)}
.isle p{margin:0;font-size:13px;color:var(--muted)}
.blk{display:grid;gap:5px;padding-top:9px;border-top:1px dashed var(--line)}
.blk>a{font-weight:600;font-size:13.5px;text-decoration:none;display:flex;gap:6px}
.blk>a:hover{color:var(--accent)}
.blk>a .n{font:600 12px var(--f-mono);color:var(--accent);min-width:22px}
.pids{display:flex;flex-wrap:wrap;gap:4px;padding-left:28px}
.pid{font:500 11.5px var(--f-mono);padding:1px 6px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);text-decoration:none;cursor:pointer}
.pid:hover{border-color:var(--accent);color:var(--accent)}
.pid.dim{opacity:.3}

.howto{font-size:13.5px;color:var(--fg)!important}
.sits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:6px 8px 10px}
.sits .grp{margin-top:8px}
@media (min-width:861px){.mob{display:none!important}}
.nav-a.rel{box-shadow:inset 2px 0 0 var(--accent)}
.combo{grid-template-columns:repeat(4,minmax(0,1fr))!important}
/* block view */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{font-size:13px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);text-decoration:none;background:var(--panel)}
.tabs a.on{border-color:var(--accent);color:var(--accent)}
.bhead{display:grid;gap:10px}
.bhead h2{font-size:clamp(20px,2.6vw,26px);font-weight:700;display:flex;gap:10px;align-items:baseline}
.bhead h2 .n{font-family:var(--f-mono);color:var(--accent)}
.when{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0}
details.keep{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.keep summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;gap:8px;align-items:center}
details.keep summary::-webkit-details-marker{display:none}
details.keep summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.keep[open] summary::before{transform:rotate(90deg)}
details.keep .md{padding:0 14px 12px}
.md p{margin:.4em 0}.md ul,.md ol{margin:.4em 0;padding-left:1.3em}.md li{margin:.2em 0}
.md code{font-size:.86em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md a{color:var(--accent);text-decoration:none;font-weight:500}.md a:hover{text-decoration:underline}
.md table{border-collapse:collapse;font-size:13.5px;width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.md th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl{overflow-x:auto}

/* prompt card */
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:72px}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}}
.c-h{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 8px 14px}
.c-id{font:700 13px var(--f-mono);color:var(--accent);padding-top:2px;min-width:34px;text-decoration:none}
.c-t{flex:1;min-width:0;display:grid;gap:6px}
.c-t h3{font-size:15.5px;font-weight:600;line-height:1.35}
.meta{font-size:12.5px;color:var(--muted);line-height:1.6}
.env{font:500 11px var(--f-mono);border-radius:5px;padding:1px 6px;border:1px solid currentColor;white-space:nowrap;display:inline-block;line-height:1.5}
.env.same{color:var(--env-same)}.env.new{color:var(--env-new)}.env.agent{color:var(--env-agent)}.env.any{color:var(--env-any)}
.ph{font:600 10.5px var(--f-mono);letter-spacing:.04em;color:var(--fg);background:var(--sunk);border-radius:4px;padding:1px 5px}
.copies{display:flex;gap:6px;flex:none}
.sq{min-width:34px;height:34px;gap:6px;padding:0 9px;display:flex!important;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;position:relative}
.sq:hover{border-color:var(--accent);color:var(--accent)}
.sq .lb{font-size:12.5px;font-weight:600}
.sq.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sq.main:hover{filter:brightness(1.08);color:var(--accent-fg)}
.sq.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sq .tip{position:absolute;top:calc(100% + 6px);right:0;z-index:2;white-space:nowrap;font:500 11px var(--f-ui);background:var(--fg);color:var(--bg);padding:3px 7px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .12s}
.sq:hover .tip,.sq:focus-visible .tip{opacity:1}
.notes{padding:0 14px;font-size:13.5px;color:var(--muted)}
.ver{display:flex;gap:2px;margin:6px 14px 0;background:var(--sunk);border-radius:8px;padding:2px;width:max-content}
.ver button{border:0;background:none;padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted)}
.ver button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pre{margin:8px 14px 0;position:relative}
.pre pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.8px/1.6 var(--f-mono);background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:none}
.pre.clamp pre{max-height:13.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{margin:4px 14px 0;border:0;background:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:2px 0}
.phd{color:var(--accent);font-weight:500}
.phd.me{color:var(--think);background:var(--accent-soft);border-radius:3px;font-weight:700}
.honest{color:var(--muted)}
.c-f{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.c-f .k{font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.c-f .grp2{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.go{font:500 11.5px var(--f-mono);text-decoration:none;padding:2px 7px;border-radius:5px;border:1px solid var(--line);background:var(--bg);cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.go:hover{border-color:var(--accent);color:var(--accent)}
.go.rt{font-family:var(--f-ui);font-size:12px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;text-decoration:none;background:var(--panel);display:grid;gap:2px}
.pager a:hover{border-color:var(--accent)}
.pager a.r{text-align:right}
.pager small{font:11px var(--f-mono);color:var(--muted)}

/* route view */
.route-h{display:grid;gap:6px}
.route-h .eyebrow{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.route-h h2{font-size:clamp(20px,2.6vw,26px)}
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.step .rail2{display:flex;flex-direction:column;align-items:center}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 12px var(--f-mono);flex:none}
.step .num.alt{background:var(--panel);color:var(--accent);border:1.5px solid var(--accent)}
.step .ln{flex:1;width:2px;background:var(--line);margin:4px 0}
.step:last-child .ln{display:none}
.step .body{padding-bottom:16px;display:grid;gap:8px;min-width:0}
.conn:empty{display:none}
.conn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stepnote{font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--fg);background:var(--accent-soft);border-radius:6px;padding:2px 8px;width:max-content;max-width:100%}
.manual{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.blockstep{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 14px;display:grid;gap:8px}

.empty{color:var(--muted);padding:20px 0}
.sec-t{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.refs{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.refcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px}
.refcard h3{font-size:16px;margin-bottom:6px}
.ck{display:grid;gap:6px;counter-reset:c;padding:0;margin:0;list-style:none}
.ck li{display:flex;gap:10px;align-items:flex-start}
.ck input{margin-top:4px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:calc(56px + env(safe-area-inset-top,0px)) 0 0 0;height:auto;z-index:15;display:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  body.menu .rail{display:block}
  .menu-btn{display:grid}
  .brand small{display:none}
  .combo{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .sits{grid-template-columns:minmax(0,1fr)}
  .hero .lead{display:none}
  .sq{min-width:40px;height:40px}
        .search kbd{display:none}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .search input{padding-right:10px}
}
@media (max-width:480px){.brand b{display:none}.sq .lb{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script id="data" type="application/json">{"head": "# AI Prompt Map: ambitious work and critical thinking when AI does the work\n\nA library of ready-to-use multi-step prompts, organized by situation. Every prompt stands on its own: copy the whole prompt and paste it into any chat or agent.\n\n**Why this exists.** The goal isn't to use AI less. Blocks 0–16 help you keep thinking when it's tempting to hand everything to an agent. Blocks 17–19 are about asking AI for more: higher, deeper, wider. Block 20 is the adversarial check that keeps that ambition honest. Blocks 21–22 are about using fresh eyes and cheap execution when you don't have the seniority to push things through. Put together: notice, ask for more, show with a prototype, and verify harder.\n- You have to build critical thinking into your day on purpose, because it won't switch on by itself. Working with agents feels good, and that's exactly why your guard drops without you noticing.\n- The better the models get, the more dangerous this becomes. Obvious mistakes get rarer, answers are smooth and mostly right, and a second look starts to feel unnecessary. That's the trap.\n- Quizzes, interviews and evidence only happen if you set them up yourself. That's what the prompts below are for.\n\n**The spectrum.** Be honest about where you are right now:\n- **Cognitive offloading** is healthy. You delegate the task but you own the result.\n- **Deferral**: the tool's answer becomes your input and stops being a hypothesis.\n- **Cognitive surrender**: the AI's answer quietly becomes yours, and you no longer feel any need to check it.\n- The slide is gradual. You read the first answer carefully, skim the next one, then only glance at the outline. Eventually someone asks you about a line and you can't explain it, even with the agent's help.", "blocks": [{"n": 0, "title": "One-liners", "when": "**When to use:** you don't have time for a big prompt. Unless noted otherwise, one-liners are for the DURING or AFTER phase (the AI just answered) and go into the same chat (`[SAME CHAT]`); 0.11 and 0.12 come before the task.", "keep": "", "intro": [], "prompts": [{"id": "0.1", "title": "What decisions the model made for you", "meta": "", "notes": [], "short": null, "full": "What decisions did you make for me without being told to: defaults, interpretations, what you left out of scope, where you chose between conflicting requirements?"}, {"id": "0.2", "title": "What wasn't checked", "meta": "", "notes": [], "short": null, "full": "What did you NOT check in this result? List it honestly, even if it seems minor."}, {"id": "0.3", "title": "What would make the answer wrong", "meta": "", "notes": [], "short": null, "full": "What would have to be true for this result to be wrong? How can I check that cheaply with a real test rather than a confidence estimate?"}, {"id": "0.4", "title": "What's missing", "meta": "", "notes": [], "short": null, "full": "What did I miss? Name 2–3 things we didn't account for: requirements, edge cases, side effects, people this affects."}, {"id": "0.5", "title": "Commands and output (I'll check against the log). `[SAME CHAT]`, ideally `[AGENT WITH TOOLS]`", "meta": "", "notes": [], "short": null, "full": "Show me the exact commands you ran and their raw output, not a summary. HONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”. For each command, tell me where I can find its real output myself (tool log, terminal, CI run) so I can compare."}, {"id": "0.6", "title": "What the green check proved", "meta": "", "notes": [], "short": null, "full": "What exactly did this green check prove, and what didn't it? Could it have passed with the feature broken?"}, {"id": "0.7", "title": "Interview instead of guessing", "meta": "", "notes": [], "short": null, "full": "Before you continue, interview me about what you don't understand in this task. Ask 1–3 questions at a time."}, {"id": "0.8", "title": "The opposite position. `[SAME CHAT]`, ideally `[NEW CHAT / OTHER MODEL]`", "meta": "", "notes": [], "short": null, "full": "Argue the opposite position as strongly as you can. Don't look for a compromise and don't give a verdict."}, {"id": "0.9", "title": "Quiz on the result", "meta": "", "notes": [], "short": null, "full": "Ask me 3 questions about this result that I should be able to answer without hints. Show the answers only after I've given mine."}, {"id": "0.10", "title": "An explanation instead of a one-liner", "meta": "", "notes": [], "short": null, "full": "I don't understand this. Don't give me a one-line explanation: give me a short plan of what to understand and in what order, explain the first step, and check me with one question."}, {"id": "0.11", "title": "The goal behind the goal (altitude). `[ANY CHAT]`, BEFORE", "meta": "", "notes": [], "short": null, "full": "Before you start: what decision or action will follow from this result? Suggest a framing that sets it up directly, and tell me what you're missing to do that."}, {"id": "0.12", "title": "Deeper, not more. `[ANY CHAT]`, BEFORE", "meta": "", "notes": [], "short": null, "full": "What methods and tools would the best professional in this field use, what raw material would they start from, and what, other than you, would show the result is correct? Don't change the vocabulary, change the method."}, {"id": "0.13", "title": "Break it. Only `[NEW CHAT / OTHER MODEL]` or a subagent, AFTER", "meta": "", "notes": [], "short": null, "full": "THE RESULT AND WHAT IT PROMISES: [RESULT]. You win by producing a reproducible failure of this result: a failing test, a counterexample, or an input it gets wrong. Don't fix anything. A finding you didn't run is a hypothesis; don't invent output: if you didn't run it, write “NOT RUN”. “No problems found” is a loss; a made-up problem is a bigger loss."}, {"id": "0.14", "title": "Is it really impossible? `[ANY CHAT]`, DURING", "meta": "", "notes": [], "short": null, "full": "Break this “impossible” (or “we already tried”) into separate reasons. Which are verified facts and which are hearsay? Who or what can confirm each one directly, and what has changed since the last attempt?"}]}, {"n": 1, "title": "Standing instructions", "when": "**When to use:** ONGOING. Paste once into CLAUDE.md, AGENTS.md, Custom Instructions, a project's system prompt (Projects) or at the start of a long chat. After that, the basic habits work without copying anything.", "keep": "**Keep in mind:**\n- Quizzes, evidence and the list of decisions only appear if you've set them up in advance. By default nothing triggers them.\n- When something falls short of your bar, add a rule here, to a hook or to a test. Then it fires for everyone, automatically, and your standards keep compounding.", "intro": [], "prompts": [{"id": "1.1", "title": "Baseline rules for any assistant", "meta": "`[ANY CHAT]` (standing setup) · ONGOING", "notes": [], "after": [], "short": null, "full": "Rules for working with me (always in effect):\n1. If the result would be wrong without an answer to a question, ask before you start. Otherwise list your assumptions and keep going.\n2. After any non-trivial work, answer in this order: evidence → decisions you made yourself (defaults, interpretations, conflicting requirements, what's out of scope) → what was NOT checked → a summary of no more than 5 lines.\n3. HONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n4. For every check, say what it proved and what it didn't.\n5. At the end of a task, ask yourself “what did I miss?” and add what you find.\n6. If you changed code, finish by asking me 3 questions about specific places you changed. Don't show the answers until I've replied.\n7. Don't make high-stakes decisions for me (what to build, what affects users, whether it's safe to ship): give me options and arguments.\n8. For agents with tools: after any significant change, run a self-check (tests or an actual run) and a review by a subagent with none of our history; pass its findings to me unfiltered."}]}, {"n": 2, "title": "Universal multi-prompt", "when": "**When to use:** any non-trivial task when there's no time to pick a specialized block.", "keep": "**Keep in mind:**\n- The AI's answer is a hypothesis, not your conclusion. The moment it becomes your input without being checked, that's deferral, not offloading.\n- Write your hypothesis down before you ask. After a smooth answer, it's hard to imagine an alternative.\n- Evidence first, summary second. A green check proves one property, not everything.\n- **Look at the real output YOURSELF, in the tool log, the terminal or CI. Output the model retyped into the chat doesn't count as evidence.**\n- The ownership test: if you can't explain the result even with the AI's help, you don't own it. Understanding can be rebuilt on demand: [7.3](#7-writing-code-and-debugging).", "intro": [], "prompts": [{"id": "2.1", "title": "Full cycle", "meta": "`[ANY CHAT]` · BEFORE → AFTER", "notes": ["Short: use [2.2](#2-universal-multi-prompt)."], "after": [], "short": null, "full": "Do the task strictly in stages, in order, without skipping any.\n\nMODE: [help me think / do it for me — I'm choosing deliberately]\nTASK: [TASK]\nCONTEXT (what's known, constraints, who the result is for): [CONTEXT]\nMY HYPOTHESIS (what I expect the answer to be, written before yours): [MY HYPOTHESIS]\nHOW I'LL KNOW IT'S DONE: [DONE CRITERIA]\n\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nStage 1. Brief. 3–5 lines: goal, audience, out of scope, done criteria (if not given, propose some). If you suspect we're solving the wrong problem, say so. Ask questions ONLY if the result would be wrong without the answers: then ask up to 3 and stop. Otherwise list your assumptions and keep going.\nStage 2. The work. If MODE is “help me think”, don't hand me a finished conclusion: give me options, arguments and what I should check; I'll draw the conclusion.\nStage 3. Evidence: what you checked, how (command, source, calculation, test) and the raw result.\nStage 4. Decisions and assumptions: decisions made without my instruction (defaults, approach, interpretations); the assumptions everything rests on; where requirements conflicted and what you chose; what you left out of scope.\nStage 5. What was NOT checked. Answer: “What would have to be true for the result to be wrong?” and propose the cheapest real test.\nStage 6. Comparison with my hypothesis: where it matched, where it diverged, and what check would settle it.\nStage 7. Summary of no more than 5 lines.\nStage 8. Quiz: 3 questions about the result that I should be able to answer without hints. Don't show the answers. Stop here. After I answer, grade each one: correct / partly / wrong."}, {"id": "2.2", "title": "Short version (starting a task)", "meta": "`[ANY CHAT]` · BEFORE. To close the task: [15.1](#15-finishing-any-task).", "notes": [], "after": [], "short": null, "full": "Task: [TASK]\nMy guess at the answer: [MY HYPOTHESIS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nDo the task. Then, in order: 1) evidence; 2) decisions and assumptions you made yourself; 3) what was NOT checked; 4) how my answer differs from yours; 5) a summary of up to 3 lines; 6) one question to test my understanding. Don't show the answer; stop there."}]}, {"n": 3, "title": "Delegate or not", "when": "**When to use:** BEFORE a task, when you're not sure whether you can hand all of it to AI.", "keep": "**Keep in mind:**\n- Where mistakes are cheap, hand it off completely (picking one of three hotels, say). Keep the reasoning for yourself where other people will deal with the fallout: investments, career advice for your kids and, at work, what to build, which changes affect users, whether it's safe to ship.\n- You can and should hand error detection to agents. The decision and the sign-off stay with you: you can delegate the work and most of the audit, but not the responsibility.\n- How much to trust an agent on a given task is also your call. Model failure modes keep changing, so calibrating trust takes review.\n- Decide up front whether you want help thinking or someone to think for you. Either is fine as long as the choice is deliberate.", "intro": [], "prompts": [{"id": "3.1", "title": "Sorting a task by stakes", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Help me split the work on this task between me and the AI. Do NOT solve the task itself. I'll choose the mode; you offer an assessment and arguments.\n\nTASK: [TASK]\nWHO GETS HURT IF THE RESULT IS WRONG: [WHO]\n\n1. Cost of a mistake (low / medium / high) in 1–2 lines: who deals with the fallout, and whether it's reversible.\n2. Which mode you'd suggest and why: “hand it off completely” / “hand off the work, I keep the checking” / “I think it through myself, the AI argues and asks questions”.\n3. What can be handed off, and which decisions must stay with me (what we're doing, why, who it affects, what we're giving up).\n4. What the check will look like: what I need to see with my own eyes.\n5. One question for me that will show whether I understand the task well enough to delegate it."}, {"id": "3.2", "title": "Hand it off completely (low stakes)", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "A mistake on this task is cheap. Do all of it, with no clarifying questions and no check-ins along the way.\nTASK: [TASK]\nAt the end, one line: the main assumption you made, and one thing I should look at myself."}]}, {"n": 4, "title": "Framing the task and the brief", "when": "**When to use:** BEFORE a task, when the result could easily “look finished” and you don't fully know what you want; DURING, when edits aren't converging (4.3).", "keep": "**Keep in mind:**\n- The human now sits at the input (framing, context) and the output (review). Writing a good prompt is a critical-thinking skill too.\n- A colleague would ask a follow-up question; the AI fills the gaps itself and returns something that looks finished. Unstated goals, constraints and motives are called intent debt. Nobody will pay it off for you.\n- If you can't state the task clearly, it's probably not clear in your head either. Before you ask, write a brief in your own words: audience, what's out of scope, done criteria.\n- If a second round of edits didn't help, stop tweaking the result and rewrite the framing ([4.3](#4-framing-the-task-and-the-brief)).\n- A good session ends with a sharper mental model, not just a finished result.", "intro": [], "prompts": [{"id": "4.1", "title": "Interview instead of a brief", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Before you do anything, interview me. The goal is to find out what you don't understand about the task and to help me get clear on it myself. Don't do anything or propose solutions until the interview is over.\n\nROUGH TASK (messy is fine): [TASK]\n\nRules:\n- 1–3 questions at a time, then wait for my answer. 3 rounds at most.\n- Find out: the real goal, who the result is for, constraints, what's out of scope, how I'll know it's done, what's unacceptable to me.\n- If my answers contradict each other, point it out.\n- If I write “enough”, go straight to the brief and move anything unresolved to “Open questions”.\n\nAt the end, a 5–8 line brief: Goal / Audience / Constraints / Out of scope / Done criteria / Open questions.\nSeparately: “What you stated vaguely”: 1–3 points I should think through myself."}, {"id": "4.2", "title": "Checking the brief for holes", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Here is my brief. Don't do the task. Find the gaps you, as the one doing the work, would fill with your own guesses.\n\nBRIEF: [MY BRIEF]\n\n1. Places where you'd fill in the blanks yourself, and what default you'd choose in each.\n2. Unstated requirements I clearly have, judging by the text, but haven't written down.\n3. Possible conflicts between requirements, and a question for me: which matters more.\n4. The same brief with every hole marked as a question to me in [brackets]. Don't make up the answers."}, {"id": "4.3", "title": "Restart after edits that didn't work", "meta": "`[SAME CHAT]` · DURING", "notes": [], "after": ["After answering, rewrite the framing yourself and run it through [4.2](#4-framing-the-task-and-the-brief)."], "short": null, "full": "We've done several rounds of edits and the result still isn't right. Stop. Don't edit the result and don't write a new framing for me.\n\nORIGINAL FRAMING: [WHAT I ASKED FOR]\nWHAT'S WRONG WITH THE RESULT: [WHAT'S WRONG]\n\n1. Assumptions you made because the framing was vague.\n2. Where my edits contradict the original framing or each other. Quote my messages.\n3. Ask me 3–5 questions whose answers will reveal what I want but haven't said. Don't suggest answers of your own.\n4. After I answer, don't rewrite the framing: I'll rewrite it myself and send it to you to check for holes."}]}, {"n": 5, "title": "A new unfamiliar task", "when": "**When to use:** you're taking on an area you haven't worked in and have no sense of what the answer should look like.", "keep": "**Keep in mind:**\n- Even in unfamiliar territory, write down a guess first. A bad guess is fine: it's a point of comparison.\n- If you have no reference points at all, do a blind spot pass: give the model everything you know and let it find your unknown unknowns.\n- If something is beyond your understanding, learn it instead of settling for a one-line explanation.", "intro": [], "prompts": [{"id": "5.1", "title": "Finding blind spots", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "I'm starting a task in an area where I have little experience. Don't solve the task. Find my blind spots.\n\nTASK: [TASK]\nWHAT I ALREADY KNOW OR THINK (guesses included): [WHAT I KNOW]\nMY HYPOTHESIS ABOUT HOW THIS GETS SOLVED: [MY HYPOTHESIS]\n\n1. What I seem to understand correctly, judging by what I wrote.\n2. What I misunderstand or oversimplify, and why.\n3. Unknown unknowns: 5–7 things I probably haven't thought about but that usually break tasks like this. For each one, why it matters and how to spot it.\n4. Up to 7 terms I need to understand to judge your future work (one line each).\n5. Questions I should ask myself or you before moving on."}, {"id": "5.2", "title": "Learning mode: with me, not instead of me", "meta": "`[ANY CHAT]` · DURING", "notes": [], "after": [], "short": null, "full": "Work with me in learning mode. I need not just the result but enough understanding to defend it in front of an expert.\n\nTASK: [TASK]\n\nRules:\n- Break the task into 3–6 steps. Before each step, ask how I would do it and wait for my answer.\n- Then show your version and explain how it's better or worse than mine.\n- If I use a term incorrectly, correct me.\n- If I'm missing knowledge for a step, don't give a one-line explanation. Give me a short study plan (what to understand, in what order, what kind of source) and check me with a question before moving on.\n- At the end, ask me 5 questions about the key decisions in the task. Show the answers only after mine."}, {"id": "5.3", "title": "The mental model you leave with", "meta": "`[SAME CHAT]` · AFTER", "notes": [], "after": [], "short": null, "full": "We've finished a task in an area that's new to me. Check what mental model I've come away with.\n\nWHAT WE DID (briefly): [WHAT WE DID]\nMY EXPLANATION, IN MY OWN WORDS, OF HOW IT WORKS: [MY EXPLANATION]\n\n1. Mistakes and gaps in my explanation.\n2. Three things I'd need to understand to change this result myself a month from now. Judging by my explanation, do I understand them?\n3. What, judging by my explanation, I don't know that I don't know.\n4. What I should study more deeply and what I can safely leave to the AI, and why."}]}, {"n": 6, "title": "Architecture and design", "when": "**When to use:** designing a system, choosing an approach, writing a design doc: any decision that's expensive to change later.", "keep": "**Keep in mind:**\n- Decisions about what we build, why it's worth doing, who it affects and what we're giving up stay yours. The AI helps you work them through, but even the best model won't make them.\n- Don't ask “is the AI right?”; ask “what would have to be true for this to be wrong?” and go check. A model's self-reported confidence is worth less than a real test, so give it a test.\n- Signing off on a design doc after reading only the table of contents is the same cognitive debt as in code. It surfaces when the system has to change.", "intro": [], "prompts": [{"id": "6.1", "title": "Options before a recommendation", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": "Task: [TASK]. My choice: [MY HYPOTHESIS]. Give me 3 substantially different options (one of them minimal) with the cost of each. For my option: what would have to be true for it to be wrong, and how to check that cheaply. Give your recommendation last. The decision is mine.", "full": "Help me make an architecture decision. Don't give a recommendation right away.\n\nTASK / PROBLEM: [TASK]\nCONSTRAINTS (load, team, deadlines, existing system): [CONSTRAINTS]\nMY TENTATIVE CHOICE AND WHY: [MY HYPOTHESIS]\n\n1. Are we solving the right problem? Restate it and name the problem it's easy to confuse it with.\n2. 3 substantially different options, including “do nothing / minimal”. For each: the gist, what we give up, who it affects, what will be expensive to change later.\n3. For my option: 3–5 conditions of the form “what would have to be true for it to be wrong” and how to check each one cheaply (a measurement, a prototype, a data query, a question to a person).\n4. Only now: your recommendation and the one check that would most strongly confirm or refute it.\n5. The decisions that I, not you, need to make."}, {"id": "6.2", "title": "Stress-testing a design", "meta": "`[NEW CHAT / OTHER MODEL]` · DURING", "notes": [], "after": [], "short": null, "full": "Here is a design or plan I'm about to adopt. Your job is to attack it, not approve it. Don't soften the criticism.\n\nDESIGN: [DESIGN TEXT]\n\n1. The strongest argument against it, the way an experienced skeptic would put it.\n2. Failure scenarios: what breaks first as load grows, when requirements change, when the author leaves.\n3. The hidden assumptions the design rests on.\n4. For each risk, a test or experiment that would confirm or refute it. I need checks, not confidence estimates.\n5. A question for me: which of these risks am I willing to accept deliberately, and why."}, {"id": "6.3", "title": "Can I defend this decision", "meta": "`[SAME CHAT]` · AFTER", "notes": [], "after": [], "short": null, "full": "We've made an architecture decision. Check whether I can defend it.\n\nDECISION: [DECISION]\n\n1. Ask me 5 questions a strong engineer would ask in a design review (why not alternative X, what happens when Y fails, how do we roll back). Wait for my answers.\n2. Grade my answers and tell me where I'm shaky.\n3. (Optional) A short decision record (ADR), 8–10 lines: context, decision, alternatives considered, what we give up, under what condition we revisit it."}]}, {"n": 7, "title": "Writing code and debugging", "when": "**When to use:** the AI is writing, changing or fixing code.", "keep": "**Keep in mind:**\n- Give the agent a way to check its own work: e2e tests, property tests, real interaction with the app. The loop “change → run → read the output → repeat” should run before you look. Instead of reading every line, you build verification loops and look at the evidence.\n- A test written with the same mistake as the code will pass. A green check is one property.\n- Comprehension debt: the code is clean, the tests are green, and nobody understands it. On a team, the shared theory of the system erodes on top of that. It surfaces when the system has to change.\n- Holding a complete model of a large codebase in your head is impossible, and that's fine. Rebuild understanding on demand: ask for an explanation of the slice you need ([7.3](#7-writing-code-and-debugging)). This debt is recoverable as long as you know what you don't know.\n- Look at the real output yourself in the log/terminal/CI (see [block 9](#9-verification)).", "intro": [], "prompts": [{"id": "7.1", "title": "A coding task with a verification loop", "meta": "`[AGENT WITH TOOLS]` · BEFORE → AFTER", "notes": [], "after": [], "short": "Task: [TASK]. My hypothesis: [MY HYPOTHESIS]. Before writing code, list the checks that will prove it's done. Then loop: change → run → read the output. At the end: the raw output of the last commands and where I can see the real output myself (log, terminal, CI), the decisions you made yourself, and what wasn't checked. Don't invent output: if you didn't run it, write “NOT RUN”.", "full": "Write or change code for the task below. Work in a self-checking loop.\n\nTASK: [TASK]\nCONTEXT (language, framework, where the code lives, what must not be touched): [CONTEXT]\nMY HYPOTHESIS (how to do it and where the catch is): [MY HYPOTHESIS]\nWHAT COUNTS AS “VERIFIED” (the output of prompt 9.2): [DEFINITION OF VERIFIED]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nBefore writing code:\n1. Restate the task in 2–3 lines and say what's out of scope.\n2. If “verified” isn't defined, propose a list of checks and the behaviors they confirm. Show it to me and wait for my “ok” before writing code.\n\nThe work:\n3. After every significant change, run the checks, read the output, fix.\n4. At least one test must check behavior rather than repeat the implementation's logic. Explain why it would fail if the feature were broken.\n\nAfter:\n5. The last commands you ran, their raw output, and where I can see the real output myself (log, terminal, CI).\n6. Decisions you made yourself: defaults, edge cases, what you left out of scope, where you interpreted requirements.\n7. What wasn't checked and how to check it."}, {"id": "7.2", "title": "Self-critique with fresh eyes", "meta": "`[NEW CHAT / OTHER MODEL]` or a subagent · DURING", "notes": ["Only in a new chat, a different model, or a subagent with no history (in the same chat the model defends its own code). In Claude Code: “Run a subagent with none of our history using this prompt and return its findings unfiltered.” Make it a standing step in [1.1](#1-standing-instructions) or a hook."], "after": [], "short": null, "full": "You are a strict reviewer. You're seeing this code for the first time and you're responsible for production.\n\nCODE / DIFF: [CODE]\nWHAT IT SHOULD DO: [REQUIREMENT]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nFind:\n1. Edge-case bugs: empty values, network failures, concurrent access, order of operations, transaction boundaries.\n2. Inverted or suspicious defaults.\n3. Places where the code does more or less than was asked.\n4. Tests that would pass even with broken logic.\nFor each finding, give the location, why it's a problem and how to check it. If a section has nothing, say so; don't make things up."}, {"id": "7.3", "title": "Explain a slice of code to me", "meta": "`[ANY CHAT]`, ideally `[AGENT WITH TOOLS]` · DURING / AFTER", "notes": [], "after": [], "short": null, "full": "I need to rebuild my understanding of a specific piece of code, not the whole system.\n\nCODE / FILES / MODULE: [CODE OR PATH]\nWHAT I WANT TO UNDERSTAND OR CHANGE: [QUESTION]\nMY CURRENT PICTURE OF HOW IT WORKS: [MY HYPOTHESIS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. First, show me where my picture is wrong.\n2. The data and control flow in this slice: input → key steps → output, with specific functions and lines.\n3. Non-obvious invariants and the places that are easy to break when changing it.\n4. What, judging by my question, I don't know that I don't know.\n5. 3 questions for me to check that I now understand the slice. Answers after mine."}, {"id": "7.4", "title": "Debugging and incidents", "meta": "`[AGENT WITH TOOLS]` or `[ANY CHAT]` · DURING", "notes": [], "after": [], "short": "Symptom: [SYMPTOM]. My hypothesis: [MY HYPOTHESIS]. Give me 3 hypotheses for the cause and, for each, a cheap check that would rule it out. Don't fix anything until the cause is confirmed. Don't invent output: if you didn't run it, write “NOT RUN”.", "full": "Help me get to the bottom of a bug or incident. Don't fix anything until a check has confirmed the cause.\n\nSYMPTOM (what we see, where, how to reproduce): [SYMPTOM]\nWHAT CHANGED RECENTLY: [WHAT CHANGED]\nMY HYPOTHESIS FOR THE CAUSE: [MY HYPOTHESIS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. The reproduction step that currently fails. This becomes the “fixed” criterion.\n2. 3 hypotheses for the cause, including mine. For each, the cheapest check that would RULE IT OUT, and what each result would mean.\n3. Run the checks (or give them to me) and cross off the hypotheses that were ruled out.\n4. Only once the cause is confirmed: the fix. After the fix, the same reproduction step must pass: show its output.\n5. Decisions you made along the way, and what the fix might affect.\n6. Why the existing checks didn't catch this, and what test or rule to add so it gets caught automatically."}]}, {"n": 8, "title": "Code review and PRs", "when": "**When to use:** you're reviewing a diff or PR, especially one generated by AI, before merging.", "keep": "**Keep in mind:**\n- Writing and reviewing are different skills, and review easily slides into rubber-stamping. You glance at the structure, the names look fine, the tests pass: approved. Meanwhile, somewhere in the middle, the order inside a transaction boundary subtly changed, or a default flipped on an edge case. Review like that and you only ever check what you expected to find.\n- **Read the diff yourself first, as if an AI hadn't written it.** Then look beyond the diff: what decisions the agent made (defaults, what's out of scope, which requirement it reinterpreted when two conflicted). Prompt 8.1 supplements your reading; it doesn't replace it.\n- Test yourself: pick lines at random and ask yourself “what about this one?”. Merge after the quiz.\n- If you can't say what the automated checks will miss, you need a real review, not a quick approval.\n- Understand what you ship well enough to defend it.", "intro": [], "prompts": [{"id": "8.1", "title": "A report on the agent's decisions", "meta": "`[ANY CHAT]` · DURING review (after your first read of the diff)", "notes": [], "after": [], "short": null, "full": "Here is a diff/PR. I don't want a recap of the changes; I want a report on the decisions.\n\nDIFF / PR: [DIFF]\nORIGINAL TASK: [TASK]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Decisions made without explicit instruction in the task: defaults, error handling, choice of libraries and approaches.\n2. Where requirements conflicted or were unclear, and how they were interpreted.\n3. What was left out of scope and what might surprise a user.\n4. High-risk spots (file and line): transaction boundaries, order of operations, concurrency, permissions, migrations, backward compatibility.\n5. What tests, linters and CI will NOT catch in this change.\n6. Places that are easy to miss when reading. This supplements a full read; it doesn't replace it."}, {"id": "8.2", "title": "A quiz before merging", "meta": "`[ANY CHAT]` · AFTER review", "notes": [], "after": [], "short": "Before I merge, ask me 3 questions about specific non-obvious places in this diff (file and line), plus the lines I name: [FILE:LINE]. No hints. Give the verdict “ready to merge” only if every answer is correct.", "full": "I've read this PR and I'm about to merge it. Check whether I understand it well enough to defend it.\n\nDIFF / PR: [DIFF]\nLINES I PICKED AT RANDOM (1–2): [FILE:LINE]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Ask me questions:\n   - for each line I picked: “what does it do and why is it like this”;\n   - 2 questions like that about non-obvious places you pick (file and line);\n   - 1 about behavior on an edge case;\n   - 1 “what breaks if this is reverted or reordered”;\n   - 1 about what the tests don't cover.\n2. Wait for my answers. No hints.\n3. Grade each answer: correct / partly / wrong, with an explanation.\n4. Give the verdict “ready to merge” only if every answer is correct. Otherwise tell me exactly what to reread."}, {"id": "8.3", "title": "Triaging incoming PRs", "meta": "`[ANY CHAT]` · DURING", "notes": [], "after": [], "short": null, "full": "Help me spread my attention across several PRs. Don't approve or reject them yourself: that's my call.\n\nPRS (list, descriptions or diffs): [PR LIST]\nPROJECT GUIDELINES / RULES: [RULES]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nFor each PR:\n1. What it changes, in one line.\n2. Conflicts with the guidelines, quoting the rule.\n3. Where it needs my attention and why: risk, ambiguity, impact on users.\n4. Attention level: “quick look” / “careful read” / “discuss with the author”.\nSort by the attention needed, highest first."}]}, {"n": 9, "title": "Verification", "when": "**When to use:** BEFORE a task, to define what counts as verified, and AFTER, when the AI reports “done”, “it all works” or “tests are green”.", "keep": "**Keep in mind:**\n- The bottleneck has moved: the hard part is no longer writing, it's being sure everything is right. Setting up a check is cheap; knowing what a good check looks like is hard.\n- You can surrender in verification too: “is there evidence?” quietly turns into “is the check green?”. A test can pass with the feature broken.\n- Define “verified” in advance. After the fact, any outcome is easy to explain as a success.\n- When you get “done”, look at the command that ran and its output first, then the summary.\n- **Look at the real output YOURSELF, in the tool log, the terminal or CI. Output the model retyped into the chat doesn't count as evidence.**\n- Checking the machine's work is real work, not free. Put it in the plan as its own line.", "intro": [], "prompts": [{"id": "9.1", "title": "What the green check proved", "meta": "`[SAME CHAT]` · AFTER", "notes": ["Short: one-liners [0.5](#0-one-liners) and [0.6](#0-one-liners)."], "after": [], "short": null, "full": "You reported that the task is done or the checks passed. Before I believe it, answer point by point. I'll compare your answer with the real tool, terminal or CI log.\n\nTASK: [TASK]\nCLAIMED RESULT: [WHAT THE AI SAID]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. The exact commands or actions you ran, and their actual output.\n2. For each check: what property it PROVED and what it did NOT prove.\n3. Could the check have passed if the feature were broken? How exactly?\n4. The most likely way the result turns out to be wrong in real use.\n5. One additional check that would raise confidence the most. If you can, run it and show the output."}, {"id": "9.2", "title": "Define “verified” in advance", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Before any work starts, let's agree on what will count as a verified result. Don't do the task itself yet.\n\nTASK: [TASK]\n\n1. 3–7 properties that must be true for the task to count as done. I want behavior, not “the code is written”.\n2. For each property, a concrete check: what to run or look at, and what result counts as success.\n3. Which checks can be automated and which need my eyes (a screenshot, a log, a manual scenario). Estimate how long my part will take; I'll put it in the plan.\n4. What will be the tangible evidence that it's finished: a test, a screenshot, a log or a trace.\n5. Which outcome I could “explain” as a success after the fact even though it's a failure. Write it down so we don't accept it."}]}, {"n": 10, "title": "Research and document synthesis", "when": "**When to use:** the AI is pulling together many sources: interviews, calls, documents, competitive analysis, research.", "keep": "**Keep in mind:**\n- A synthesis sounds convincing whether or not it's right. Check a couple of the source documents yourself.\n- Find the number the recommendation hinges on and check that one.\n- In a chain of summaries, the next agent never read the original.\n- For an important document, close it and reconstruct the main argument from memory.", "intro": [], "prompts": [{"id": "10.1", "title": "Synthesis with traceability", "meta": "`[ANY CHAT]` · BEFORE / DURING", "notes": [], "after": [], "short": null, "full": "Synthesize these materials so that every conclusion can be checked against a source.\n\nMATERIALS: [DOCUMENTS / NOTES / LINKS]\nQUESTION: [QUESTION]\nWHAT I EXPECT TO SEE: [MY HYPOTHESIS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nRules: every conclusion gets a reference to a specific source and a short direct quote; say how many sources support it and whether any contradict it; keep “stated directly in the sources” separate from “my interpretation”.\n\n1. Key conclusions with references and quotes.\n2. Contradictions between sources.\n3. What's missing from the materials even though it matters for the question.\n4. The number or fact the recommendation depends on most, and where it is in the sources.\n5. 2–3 source documents I should read myself, and why those.\n6. Where the synthesis diverged from what I expected."}, {"id": "10.2", "title": "Auditing a finished synthesis", "meta": "`[NEW CHAT / OTHER MODEL]` · AFTER", "notes": [], "after": [], "short": null, "full": "Here is a finished synthesis and the source materials. Check the synthesis; don't retell it.\n\nSYNTHESIS: [SYNTHESIS TEXT]\nSOURCES: [SOURCE MATERIALS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Take 3 key claims and find support for them in the sources, with quotes. If there's no support, or it's weaker than presented, say so.\n2. Numbers: where they came from, whether they were calculated correctly, whether units or samples got mixed up.\n3. What's in the sources but didn't make it into the synthesis, and whether it changes the conclusion.\n4. Signs of a “summary of a summary”: confident claims with no specific source behind them."}, {"id": "10.3", "title": "Reconstruct the argument from memory", "meta": "`[ANY CHAT]` · AFTER", "notes": [], "after": [], "short": null, "full": "Check whether I actually understood the document or just skimmed it.\n\nDOCUMENT: [DOCUMENT]\nMY SUMMARY OF THE MAIN ARGUMENT FROM MEMORY (no peeking): [MY SUMMARY]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Compare my summary with the document: what I got right, what I distorted, what important points I left out.\n2. The document's main argument in 3 sentences.\n3. 3 questions for me about the key points. Wait for my answers, then grade them."}]}, {"n": 11, "title": "High-stakes decisions", "when": "**When to use:** what to build, money, careers, changes that affect users, whether to ship, a position on a contested question.", "keep": "**Keep in mind:**\n- Here you keep the reasoning for yourself, because other people will deal with the consequences. The AI is a sparring partner, not a judge.\n- On open questions where you hold a firm position, ask more than one model to argue the opposite. Form your own view after that.\n- The bar: would you put your name on this in front of the person who'll have to maintain it?", "intro": [], "prompts": [{"id": "11.1", "title": "The strongest counterargument", "meta": "`[NEW CHAT / OTHER MODEL]`, run in 2–3 models · DURING", "notes": [], "after": [], "short": null, "full": "I hold a position on an important question. Build the strongest possible argument AGAINST it. Don't agree with me and don't look for a compromise.\n\nQUESTION: [QUESTION]\nMY POSITION AND WHY: [MY POSITION]\n\n1. The opposite position as a smart, well-informed advocate would put it.\n2. The three strongest arguments for it, and the facts or mechanisms they rest on.\n3. Where my reasoning is weakest.\n4. Which facts would tip the decision one way or the other, and how to check them.\n5. Don't give a final verdict. Instead, ask me 2 questions that will help me form my own view."}, {"id": "11.2", "title": "A pre-mortem for a decision", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Imagine the decision below turned out to be a mistake. Work out why.\n\nDECISION: [DECISION]\nHOW LONG UNTIL IT BECAME CLEAR IT WAS A MISTAKE: [TIMEFRAME]\nWHO IS AFFECTED: [PEOPLE / USERS / TEAM]\nWHAT WE'RE WILLING TO GIVE UP: [TRADE-OFFS]\n\n1. The 5 most plausible reasons it failed, starting with the most likely.\n2. For each: what would already have to be true now for it to happen, and how to check that before deciding.\n3. Who, besides me, will be dealing with the consequences of each one.\n4. Which questions I haven't answered explicitly yet: what we're doing, why, who it affects, what we're giving up.\n5. An early signal: what sign will tell me quickly that the decision is going the wrong way."}, {"id": "11.3", "title": "The “would I put my name on it” test", "meta": "`[ANY CHAT]` · AFTER", "notes": [], "after": [], "short": null, "full": "I'm about to adopt or release this under my name. Test me.\n\nDECISION / DOCUMENT: [DECISION]\nWHO IT'S FOR: [WHO WILL READ / CARRY OUT / MAINTAIN IT]\n\n1. Ask me 5 tough questions that person would ask. Wait for my answers.\n2. Note where I answered confidently and to the point, and where I fell back on “the AI said so” or got away with generalities.\n3. Claims in the decision that, judging by my answers, I can't justify myself.\n4. Verdict: is this ready to go out under my name, and if not, what's left to do."}]}, {"n": 12, "title": "Writing and content", "when": "**When to use:** the AI is writing or editing text: an article, an email, a post, documentation, a presentation.", "keep": "**Keep in mind:**\n- Polish and a confident tone are no longer signs of quality. If you're not ready to own the text, don't publish it.\n- The thinking comes from you first; the wording comes after.\n- If two rounds of edits didn't help, rewrite the framing, not the text: [4.3](#4-framing-the-task-and-the-brief).", "intro": [], "prompts": [{"id": "12.1", "title": "My thesis first, then the text", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Help me write a piece, but the thinking has to be mine. Don't write the text yet.\n\nTYPE OF TEXT AND AUDIENCE: [WHAT AND FOR WHOM]\nMY MAIN THESIS IN 1–2 SENTENCES: [THESIS]\nWHAT THE READER SHOULD DO OR UNDERSTAND: [GOAL]\nWHAT MUST NOT BE IN THE TEXT: [OUT OF SCOPE]\n\n1. Test the thesis: is it clear, is it arguable, what's missing from it. Ask up to 3 clarifying questions and wait for my answers.\n2. Propose a structure (bullet points, not prose) and wait for my agreement.\n3. Only then write. Mark with [?] any place where you added claims or facts that weren't in my thesis or answers."}, {"id": "12.2", "title": "Editing without losing authorship", "meta": "`[ANY CHAT]` · AFTER", "notes": [], "after": [], "short": null, "full": "Here is a text that AI wrote or helped write. Check whether I can publish it under my name.\n\nTEXT: [TEXT]\nWHAT I ORIGINALLY MEANT TO SAY: [WHAT I WANTED TO SAY]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Factual claims, numbers and references that need checking, with the origin of each: from my original intent / added by the AI / “unknown, check it”.\n2. Places that sound confident but are empty or generic.\n3. Where the text drifted from WHAT I ORIGINALLY MEANT or claims more than I'm prepared to claim.\n4. The text's main argument in one sentence. Does it match what I originally meant?\n5. One rule for future texts that would prevent the most serious problem you found. I'll add it to my standing instructions."}]}, {"n": 13, "title": "Multi-agent work and orchestration", "when": "**When to use:** several agents or sessions running in parallel, chains of agents, subagents, pipelines.", "keep": "**Keep in mind:**\n- There can be many agents, but you have only one pair of eyes. Orchestration tax is the gap between what the agents generate and what you're prepared to put your name on.\n- If finished work piles up faster than you can check it, another session won't help. There are two ways out, and both are fine: tighten the checks so the work needs you less, or slow down. If you produce more than you can verify, you're not reviewing, you're hoping.\n- Agents pass summaries to each other, and the third agent never read the original. Pass along sources, not summaries.\n- Agents can guard your attention: triage, flag contradictions, narrow the focus. The decision stays with you.", "intro": [], "prompts": [{"id": "13.1", "title": "An orchestration plan that fits my capacity", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": "Task: [TASK]. I have [TIME] for checking. Split it into subtasks for agents so that each one passes along sources rather than summaries and checks itself, and my own check is a separate line in the plan. If the checking doesn't fit in my time, propose tightening the checks or running less in parallel.", "full": "Help me plan the work of several agents so that I can keep up with checking the results instead of letting them pile up.\n\nOVERALL TASK: [TASK]\nHOW MUCH TIME I HAVE FOR CHECKING: [TIME]\nWHICH AGENTS / MODELS / TOOLS, AND WHETHER THEY CAN RUN CODE AND ACCESS FILES: [AGENTS AND TOOLS]\n\n1. Subtasks. For each: input (source materials, not summaries), output, how the agent will check its own work (a test, a run, a comparison with the source).\n2. What in each subtask will need my attention specifically, and roughly how long.\n3. Compare the total time my checking will take with the time I have. If it doesn't fit, offer two paths: tighten and automate the checks, or run less in parallel and slow down. I'll choose.\n4. Where in the chain agents will pass summaries instead of originals, and how to avoid it.\n5. A critic agent with a fresh context that checks the others' results. “My check” is a separate step in the plan, with time attached."}, {"id": "13.2", "title": "A brief for a subagent", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Write a brief for another agent that will do a subtask without access to our conversation.\n\nSUBTASK: [SUBTASK]\nSOURCE MATERIALS FOR IT: [FILES / DOCUMENTS / LINKS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nGive me the brief as ONE code block so I can copy it whole. Include in the brief:\n1. The goal and why it matters, not just what to do.\n2. Constraints and what's out of scope.\n3. Paths and links to the originals, not a summary. Mark any unavoidable summary as “SUMMARY”.\n4. The done criteria and a way to self-check.\n5. The report format: raw evidence (commands and output, quotes from sources), decisions and assumptions, what wasn't checked.\n6. The HONESTY line from this message, word for word.\n\nSeparately, outside the block: “What's missing”: what an agent that hasn't seen our conversation will get wrong with this brief."}, {"id": "13.3", "title": "A rundown of the agents' results", "meta": "`[ANY CHAT]` · AFTER", "notes": [], "after": [], "short": null, "full": "Several agents have finished their work. Help me figure out what to look at, rather than accepting everything wholesale.\n\nAGENTS' RESULTS / REPORTS: [REPORTS]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. For each result: is there raw evidence (commands and output, quotes, screenshots) or only a summary? Mark results that have only a summary as “unconfirmed”.\n2. Contradictions between agents.\n3. Where an agent worked from a summary rather than the original.\n4. Decisions and assumptions the agents made on their own.\n5. My attention queue: what to check personally (highest risk first), and what can be accepted on the strength of the automated checks.\n6. If there's more than I can check: what to send back for rework with stricter checks, and what to postpone and run less often."}]}, {"n": 14, "title": "Long sessions and handing off context", "when": "**When to use:** a session has been running for a long time, you've stopped understanding what's going on, or the context is running out and you need to continue in a new chat.", "keep": "**Keep in mind:**\n- The slide is gradual, and in a long session it's easy to end up reading only the outline of each answer.\n- Summaries lose detail. When you move to a new chat, pass along paths and links to the originals, and mark any summary as a summary.", "intro": [], "prompts": [{"id": "14.1", "title": "Lost the thread", "meta": "`[SAME CHAT]` · DURING", "notes": [], "after": [], "short": null, "full": "Stop. I've lost the thread. Don't change anything and don't continue the work until I reply.\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. The original goal, word for word from my message.\n2. What's been done. Mark each item “confirmed” (by what exactly) or “no evidence”.\n3. Decisions you made along the way without me.\n4. Where we drifted from the original task, and why.\n5. Open problems.\n6. What you're doing right now, and why.\n7. 2 questions for me that have to be answered before we can go on."}, {"id": "14.2", "title": "A handoff package for a new session", "meta": "`[SAME CHAT]` (to build it) → `[NEW CHAT / OTHER MODEL]` (to paste it) · DURING", "notes": [], "after": ["Before you paste the package into a new chat, read it yourself: that's your check against what you remember."], "short": null, "full": "Put together a handoff package for a new session that hasn't seen our conversation. Give it to me as ONE code block.\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\nIn the package:\n1. The goal and the done criteria.\n2. What's been done and what proves it: command and output, file, quote. If there's no evidence, say so.\n3. Decisions and assumptions made along the way.\n4. What was NOT checked.\n5. A list of sources: file paths and links, not a summary. Mark any unavoidable summary as “SUMMARY”.\n6. The next step.\n7. At the end, copy this same HONESTY line word for word so the new session follows it."}]}, {"n": 15, "title": "Finishing any task", "when": "**When to use:** at the end of any session with AI, before you close, send, merge or ship. To start a task: [2.2](#2-universal-multi-prompt).", "keep": "**Keep in mind:**\n- The finish should be tangible: a passing test, a screenshot, a log, a verified source.\n- Find out which decisions the AI made for you.\n- **The final exercise is yours to do.** Before asking the AI, write down what you think will happen (that's the MY HYPOTHESIS field at the start). Before this prompt, write down one thing yourself that the agent didn't check. Only then compare with point 3.", "intro": [], "prompts": [{"id": "15.1", "title": "The closing protocol", "meta": "`[SAME CHAT]` · AFTER", "notes": [], "after": [], "short": null, "full": "Before I close this task, go through the closing protocol. Answer briefly, point by point.\n\nTASK: [TASK]\nMY HYPOTHESIS AT THE START: [MY HYPOTHESIS]\nWHAT I THINK YOU DIDN'T CHECK (written down myself before this prompt): [MY UNVERIFIED THING]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. Tangible evidence that it's done: what exactly (a test, a command and its output, a screenshot, a quote) and where I can look at it myself.\n2. Decisions you made without me.\n3. What you did NOT check. Compare with my item: did they match, what did I miss, what did you miss.\n4. What did we miss? Everything that comes to mind, even small things.\n5. Did the result match my initial hypothesis? If not, what does that tell us.\n6. One question I should be able to answer to defend the result to someone else. Don't show the answer.\n7. If something fell short of the bar: one rule, hook or test for the shared config so that next time it gets caught automatically."}]}, {"n": 16, "title": "Calibrating your skills", "when": "**When to use:** ONGOING. Checking whether the skills that matter to you are wasting away.", "keep": "**Keep in mind:**\n- The paradox of supervision: supervising AI takes the very coding skills that waste away when you lean on AI too much. Skills you don't practice fade faster than you think.\n- Once a week, write code without an agent or do one real thing it would be bad to forget how to do. This is calibration, not a moral stance.\n- Once a month, write down what you've stopped doing yourself and decide where that's fine. Letting go is allowed, as long as it's deliberate.\n- Ask yourself: how lost would you be if AI didn't exist?", "intro": [], "prompts": [{"id": "16.1", "title": "Weekly calibration", "meta": "`[ANY CHAT]` · ONGOING (weekly)", "notes": [], "after": [], "short": null, "full": "Help me pick an exercise for this week: one real piece of work I'll do without AI, to check whether I'm losing a skill.\n\nMY WORK AND MAIN TASKS: [WHAT I DO]\nWHAT I HAND TO AI MOST OFTEN: [WHAT I DELEGATE]\nEXERCISE RESULT (if I've already done it): [RESULT]\n\nIf the RESULT field is empty:\n1. Suggest 3 exercises of 30–90 minutes: real tasks from my work that it would be bad to forget how to do.\n2. For each, what skill it tests and the specific signs that would tell me the skill has slipped.\n3. Don't help me do the exercise.\nIf RESULT is filled in, go straight to the debrief: where it was hard, what that says about the skill, how you would have done it."}, {"id": "16.2", "title": "Monthly skills audit", "meta": "`[ANY CHAT]` · ONGOING (monthly)", "notes": [], "after": [], "short": null, "full": "Run a monthly audit with me: what have I stopped doing myself since I started working with AI.\n\nWHAT I DID WITH AI THIS MONTH: [LIST OF TASKS]\nMY ANSWERS (if I've come back in a new chat): [ANSWERS]\n\nIf there are no answers yet:\n1. Ask questions 2–3 at a time to build a list of skills I've stopped practicing.\n2. For each skill, ask: how lost would I be if AI disappeared tomorrow?\nOnce there are answers:\n3. Split the skills into two columns: “Letting go deliberately” (with the reason) and “Need to maintain” (with a concrete action for next month).\n4. Where I am on the spectrum, judging by my answers: cognitive offloading (I delegate but own the result) / deferral (I take the AI's output as my input without checking) / cognitive surrender (I no longer feel any need to check).\n5. One verification habit worth adding to my day next month."}]}, {"n": 17, "title": "Aiming higher", "when": "**When to use:** BEFORE. The task is phrased as an action (“make the slides”, “fix the bug”), but what you actually need is the outcome the action is for.", "keep": "**Keep in mind:**\n- The model executes your best guess at how to reach the goal. Ask yourself: what has to happen afterwards? What's the goal behind this goal?\n- A sign it's time to go higher: there will be meetings about this work afterwards. Altitude works less well for creative tasks.\n- Going higher is the path to a durable process that runs without you in the loop: instead of “fix this crash”, set “keep the app crash-free”. But for that, the agent needs access to the raw material (reports, logs, data) and an environment where it can reproduce the problem and verify the fix itself. Preparing that environment is your job, and it may mean changing how you work.\n- More altitude means more output to check. Watch the orchestration tax ([13.1](#13-multi-agent-work-and-orchestration)).", "intro": ["Blocks 0–16 teach you not to surrender to AI; blocks 17–19 teach you to ask it for more. They're two sides of the same skill: the more ambitious the task, the stricter the verification has to be (block 9)."], "prompts": [{"id": "17.1", "title": "The goal behind the goal", "meta": "`[ANY CHAT]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Don't do the task yet. Help me take it up a level.\n\nTHE TASK AS I FRAMED IT: [TASK]\nWHY I NEED IT, AS I SEE IT: [MY HYPOTHESIS]\n\n1. A 3-rung ladder: (a) the task as it stands; (b) the decision or action that should follow from the result; frame the task so that you prepare that decision directly (options with arguments for and against); (c) why this work exists at all, and how to achieve that better than the usual way.\n2. For each rung: what data and access you need, what you're missing right now, and how I'll check the result with something other than your word.\n3. Where going higher DOESN'T make sense (a creative task, no data, no way to verify), say so plainly.\n4. Stop. I choose the rung."}, {"id": "17.2", "title": "From a task to a standing outcome", "meta": "`[AGENT WITH TOOLS]` · BEFORE", "notes": [], "after": [], "short": null, "full": "Right now I keep giving you the same kind of task over and over. I want to replace it with a standing outcome that you maintain yourself.\n\nTHE RECURRING TASK: [e.g. “fix individual crashes”]\nTHE STANDING OUTCOME I WANT: [e.g. “a crash-free app”]\nHONESTY: report command output and check results only for things you actually ran here, verbatim; otherwise write “NOT RUN: command for me …, expected output …”. Quote only text you actually have; anything you haven't opened is “no access”.\n\n1. The outcome metric: how you, without me, will know it's been achieved or broken. It must be a tool or data, not your judgment.\n2. What you need to close the loop on your own: access to the raw material (reports, logs, data), a link between “version ↔ commit/change”, an environment to reproduce and verify a fix. Mark what exists and what I need to set up.\n3. The working loop: where you observe → what you decide → what you do → how you verify → what you record.\n4. Where my decision is mandatory (shipping, irreversible actions, money, users): you only prepare those steps.\n5. Limits: when you stop and call me (the same error repeating, budget exhausted, a check that won't pass).\n6. The first step I take today."}, {"id": "17.3", "title": "A new way instead of a ritual", "meta": "`[AGENT
